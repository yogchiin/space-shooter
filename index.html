<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>太空射击</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #04070f;
        --panel: #0b1220;
        --panel-line: #1d2c47;
        --ink: #eaf2ff;
        --muted: #8fa3c4;
        --cyan: #3fe0ff;
        --orange: #ffb340;
        --red: #ff5470;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      button { min-height: 2.75rem; font-family: inherit; cursor: pointer; }

      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
        margin: 0 auto;
        position: relative;
      }

      /* ---------- HUD ---------- */
      #hud {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px 6px;
        background: linear-gradient(180deg, rgba(11,18,32,.95), rgba(11,18,32,.75));
        border-bottom: 1px solid var(--panel-line);
        z-index: 5;
      }
      .hud-block { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
      .hud-label { font-size: 10px; letter-spacing: .14em; color: var(--muted); white-space: nowrap; }
      .hud-value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #hud-score { color: var(--cyan); }
      #hud-level { color: var(--orange); }
      #hud-lives { font-size: 13px; letter-spacing: 1px; }
      .hud-spacer { flex: 1; }
      #progress-wrap { width: 64px; flex-shrink: 1; min-width: 44px; }
      #progress-track {
        height: 7px; border-radius: 4px; background: #16233c; overflow: hidden; margin-top: 3px;
      }
      #progress-fill {
        height: 100%; width: 0%; background: var(--cyan); border-radius: 4px;
        transition: width .25s ease;
      }
      #progress-fill.boss { background: var(--red); }
      #progress-fill.mini { background: var(--orange); }
      .icon-btn {
        width: 44px; height: 44px; min-height: 44px;
        border-radius: 10px; border: 1px solid var(--panel-line);
        background: var(--panel); color: var(--ink);
        font-size: 18px; display: grid; place-items: center; padding: 0;
      }
      .icon-btn:active { transform: scale(.94); }

      /* ---------- Stage ---------- */
      #stage { position: relative; flex: 1; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      /* ---------- Bottom bar ---------- */
      #bottombar {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 10px calc(7px + env(safe-area-inset-bottom));
        background: rgba(11,18,32,.9);
        border-top: 1px solid var(--panel-line);
        z-index: 5;
      }
      #weapon-info { font-size: 12px; color: var(--muted); line-height: 1.55; min-width: 0; }
      #weapon-info b { color: var(--ink); font-size: 13px; }
      #weapon-name { font-weight: 800; }
      #weapon-lv { color: var(--orange); font-weight: 800; font-size: 12px; margin-left: 2px; }
      #weapon-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a6b86; vertical-align: middle; }
      #weapon-pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 5px; }
      #weapon-pips i {
        width: 13px; height: 6px; border-radius: 3px; background: #22334f; display: inline-block;
      }
      #evo-info { color: var(--muted); font-size: 12px; white-space: nowrap; }
      #evo-info b { color: var(--orange); font-size: 12px; }
      #boost-info {
        display: none; margin-left: 8px; padding: 1px 8px; border-radius: 999px;
        background: #3a2c04; border: 1px solid #ffe93c; color: #ffe93c;
        font-size: 12px; font-weight: 800; white-space: nowrap;
        box-shadow: 0 0 10px rgba(255,233,60,.35);
      }
      #boost-info.on { display: inline-block; }
      #bomb-btn {
        margin-left: auto;
        white-space: nowrap; flex-shrink: 0;
        min-width: 108px; padding: 0 16px;
        border-radius: 12px; border: 1px solid #6b4a12;
        background: #2a1f08; color: var(--orange);
        font-size: 15px; font-weight: 700;
        display: flex; align-items: center; gap: 6px; justify-content: center;
      }
      #bomb-btn:disabled { opacity: .35; }
      #bomb-btn:active { transform: scale(.95); }

      /* ---------- Overlays ---------- */
      .overlay {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background: rgba(3, 6, 14, .78);
        backdrop-filter: blur(3px);
      }
      .overlay.hidden { display: none; }
      #start-screen { overflow-y: auto; justify-content: flex-start; padding-top: 28px; }
      .overlay h1 {
        margin: 0 0 6px; font-size: 40px; font-weight: 900; letter-spacing: .06em;
        color: var(--ink);
      }
      .overlay h1 .accent { color: var(--cyan); }
      .overlay h2 { margin: 0 0 6px; font-size: 30px; font-weight: 900; }
      .overlay p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 360px; }
      .overlay .big-score { font-size: 44px; font-weight: 900; color: var(--cyan); margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
      .overlay .sub-line { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .primary-btn {
        min-height: 52px; padding: 0 38px;
        border: none; border-radius: 14px;
        background: var(--cyan); color: #03222e;
        font-size: 18px; font-weight: 800; letter-spacing: .05em;
        box-shadow: 0 6px 24px rgba(63,224,255,.35);
      }
      .primary-btn:active { transform: scale(.96); }
      .weapon-legend {
        display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center;
        font-size: 12px; color: var(--muted); margin-bottom: 22px; max-width: 380px;
      }
      .weapon-legend b { font-weight: 700; }

      /* ---------- Floating announcements ---------- */
      #announce {
        position: absolute; left: 0; right: 0; top: 16%;
        text-align: center; pointer-events: none; z-index: 6;
        font-size: 30px; font-weight: 900; letter-spacing: .1em;
        color: var(--ink); text-shadow: 0 0 18px rgba(63,224,255,.7);
        opacity: 0; transform: scale(.85);
        transition: opacity .25s ease, transform .25s ease;
      }
      #announce.show { opacity: 1; transform: scale(1); }
      #announce.warn { color: var(--red); text-shadow: 0 0 18px rgba(255,84,112,.8); }
      #announce small { display: block; font-size: 14px; font-weight: 600; letter-spacing: .3em; color: var(--muted); margin-top: 6px; text-shadow: none; }

      #toast {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(8px);
        background: rgba(11,18,32,.92); border: 1px solid var(--panel-line);
        color: var(--ink); font-size: 13px; padding: 8px 14px; border-radius: 999px;
        opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 7;
        white-space: nowrap;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ---------- 连击 & 难度 ---------- */
      #hud-combo { color: #ff9d3c; text-shadow: 0 0 10px rgba(255,157,60,.55); }
      #combo-wrap.hot #hud-combo { color: #ff5470; text-shadow: 0 0 12px rgba(255,84,112,.7); }
      .diff-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
      .diff-btn {
        min-height: 44px; padding: 0 13px;
        border-radius: 999px; border: 1px solid var(--panel-line);
        background: var(--panel); color: var(--muted);
        font-size: 14px; font-weight: 700;
      }
      .diff-btn small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .08em; margin-top: 1px; }
      .diff-btn.sel { border-color: var(--orange); color: var(--orange); background: #2a1f08; box-shadow: 0 0 14px rgba(255,179,64,.25); }
      .diff-btn:active { transform: scale(.95); }
      .ctrl-hint { font-size: 12px !important; margin-bottom: 14px !important; }

      /* ---------- 机库商店（卡通风） ---------- */
      .secondary-btn {
        min-height: 48px; padding: 0 26px; margin-bottom: 12px;
        border-radius: 14px; border: 2px solid #b8860b;
        background: linear-gradient(180deg, #ffe066, #ffb340);
        color: #4a2c00; font-size: 16px; font-weight: 800; letter-spacing: .04em;
        box-shadow: 0 5px 18px rgba(255,179,64,.35);
      }
      .secondary-btn:active { transform: scale(.96); }
      .coin-line { font-size: 14px !important; color: var(--ink) !important; margin-bottom: 10px !important; }
      .coin-line b { color: #ffcf3c; font-variant-numeric: tabular-nums; }
      #shop-screen {
        justify-content: flex-start; overflow-y: auto; text-align: left;
        padding: 18px 14px 30px; background: rgba(3, 6, 14, .94); z-index: 30;
      }
      #shop-screen h2 { text-align: center; margin-bottom: 2px; }
      #shop-screen .shop-balance {
        text-align: center; font-size: 17px; font-weight: 800; color: #ffcf3c; margin-bottom: 4px;
      }
      #shop-screen .shop-note { text-align: center; color: var(--muted); font-size: 12px; margin: 0 auto 14px; max-width: 420px; line-height: 1.6; }
      .shop-sec {
        width: 100%; max-width: 600px; margin: 0 auto 6px;
        font-size: 15px; font-weight: 800; color: var(--ink); letter-spacing: .06em;
      }
      .shop-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
        gap: 10px; width: 100%; max-width: 600px; margin: 0 auto 16px;
      }
      .shop-card {
        border-radius: 18px; padding: 12px 12px 11px;
        background: linear-gradient(180deg, #182a47, #0d1830);
        border: 2.5px solid var(--panel-line);
        display: flex; flex-direction: column; gap: 6px;
      }
      .shop-card.owned { border-color: #3fae6a; }
      .shop-card.selected { border-color: var(--orange); box-shadow: 0 0 16px rgba(255,179,64,.35); }
      .shop-card .ship-art { display: grid; place-items: center; padding: 2px 0 0; }
      .shop-card .card-name { font-size: 16px; font-weight: 800; }
      .shop-card .card-name .tag {
        font-size: 10px; font-weight: 700; color: #03222e; background: var(--cyan);
        border-radius: 999px; padding: 1px 7px; margin-left: 5px; vertical-align: 2px;
      }
      .shop-card .card-desc { font-size: 12px; color: var(--muted); line-height: 1.55; flex: 1; }
      .shop-card .card-price { font-size: 14px; font-weight: 800; color: #ffcf3c; }
      .shop-card .card-price.free { color: #4be38a; }
      .shop-btn {
        min-height: 42px; border-radius: 12px; border: none;
        font-size: 14px; font-weight: 800; width: 100%;
      }
      .shop-btn.buy { background: linear-gradient(180deg, #ffe066, #ffb340); color: #4a2c00; }
      .shop-btn.buy:disabled { background: #2a3648; color: #66788f; cursor: not-allowed; }
      .shop-btn.pick { background: #173a2a; color: #4be38a; border: 1.5px solid #3fae6a; }
      .shop-btn.current { background: #2a1f08; color: var(--orange); border: 1.5px solid var(--orange); }
      .shop-btn:active { transform: scale(.96); }
      #shop-close-btn { margin: 2px auto 0; display: block; }

      @media (min-width: 700px) {
        #app { max-width: 720px; border-left: 1px solid var(--panel-line); border-right: 1px solid var(--panel-line); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HUD -->
      <div id="hud">
        <div class="hud-block">
          <span class="hud-label">分数</span>
          <span class="hud-value" id="hud-score">0</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">金币</span>
          <span class="hud-value" id="hud-coins" style="color:#ffcf3c">🪙 0</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">关卡</span>
          <span class="hud-value" id="hud-level">第 1 / 21 关</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">生命</span>
          <span class="hud-value" id="hud-lives"></span>
        </div>
        <div class="hud-block" id="combo-wrap" style="display:none">
          <span class="hud-label">连击</span>
          <span class="hud-value" id="hud-combo">0</span>
        </div>
        <div class="hud-spacer"></div>
        <div class="hud-block" id="progress-wrap">
          <span class="hud-label" id="progress-label">本关进度</span>
          <div id="progress-track"><div id="progress-fill"></div></div>
        </div>
        <button class="icon-btn" id="sound-btn" aria-label="声音开关">🔊</button>
        <button class="icon-btn" id="pause-btn" aria-label="暂停">⏸</button>
      </div>

      <!-- Stage -->
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="announce"></div>
        <div id="toast"></div>

        <!-- Start -->
        <div class="overlay" id="start-screen">
          <h1>太空<span class="accent">射击</span></h1>
          <div class="diff-row" role="group" aria-label="难度选择">
            <button class="diff-btn" data-diff="easy">初级<small>得分 ×0.8</small></button>
            <button class="diff-btn sel" data-diff="normal">中级<small>得分 ×1</small></button>
            <button class="diff-btn" data-diff="hard">高级<small>得分 ×1.4</small></button>
            <button class="diff-btn" data-diff="hell">骨灰级<small>得分 ×2</small></button>
          </div>
          <p class="coin-line">🪙 金币余额 <b id="start-coins">0</b> · 当前战机 <b id="start-ship" style="color:#3fe0ff">均衡型</b></p>
          <button class="secondary-btn" id="shop-btn">🛠️ 机库商店 · 买战机</button>
          <button class="primary-btn" id="start-btn">开始出击</button>
        </div>

        <!-- Game over -->
        <div class="overlay hidden" id="over-screen">
          <h2 id="over-title">战机坠毁</h2>
          <div class="big-score" id="final-score">0</div>
          <div class="sub-line" id="final-detail"></div>
          <button class="secondary-btn" id="over-shop-btn">🛠️ 机库商店 · 花金币</button>
          <button class="primary-btn" id="retry-btn">再来一局</button>
        </div>

        <!-- Paused -->
        <div class="overlay hidden" id="pause-screen">
          <h2>已暂停</h2>
          <button class="primary-btn" id="resume-btn">继续战斗</button>
        </div>

        <!-- 机库商店：用打怪爆出的金币买战机与永久功能，存档保存在本地 -->
        <div class="overlay hidden" id="shop-screen">
          <h2>🛠️ 机库商店</h2>
          <div class="shop-balance">🪙 金币余额 <span id="shop-coins">0</span></div>
          <div class="shop-sec">✈️ 战机（买过随时切换）</div>
          <div class="shop-grid" id="shop-ships"></div>
          <div class="shop-sec">⭐ 功能解锁（买过永久生效）</div>
          <div class="shop-grid" id="shop-unlocks"></div>
          <button class="primary-btn" id="shop-close-btn">返回</button>
        </div>
      </div>

      <!-- Bottom bar -->
      <div id="bottombar">
        <div id="weapon-info">
          <span id="weapon-slot" style="display:none"><b>子弹：<span id="weapon-name"></span></b><span id="weapon-lv"></span><span id="weapon-pips"><i></i><i></i><i></i><i></i><i></i></span></span><span id="weapon-dot" aria-hidden="true"></span><br />
          <span id="evo-info">形态：<b id="evo-name">单筒战机</b> · 击坠 <span id="evo-kills">0</span><span id="evo-next"></span></span><span id="boost-info">⚡ 威力翻倍 10s</span>
        </div>
        <button id="bomb-btn">⚡ 闪光弹 ×<span id="bomb-count">0</span></button>
      </div>
    </div>

    <script>
      "use strict";
      /* ============================================================
         太空射击 — canvas 纵版射击（21 关 / 7 星域 / 7 种可升级武器）
         本局状态只存在于内存中；金币余额、机库已购战机与功能解锁
         按玩家要求用 localStorage 跨局保存在本地，下次打开还在。
         ============================================================ */
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); return this; };
      }
      const stage = document.getElementById("stage");

      const el = {
        score: document.getElementById("hud-score"),
        level: document.getElementById("hud-level"),
        lives: document.getElementById("hud-lives"),
        progressFill: document.getElementById("progress-fill"),
        progressLabel: document.getElementById("progress-label"),
        announce: document.getElementById("announce"),
        toast: document.getElementById("toast"),
        startScreen: document.getElementById("start-screen"),
        overScreen: document.getElementById("over-screen"),
        pauseScreen: document.getElementById("pause-screen"),
        overTitle: document.getElementById("over-title"),
        finalScore: document.getElementById("final-score"),
        finalDetail: document.getElementById("final-detail"),
        weaponName: document.getElementById("weapon-name"),
        weaponLv: document.getElementById("weapon-lv"),
        weaponPips: document.getElementById("weapon-pips"),
        weaponSlot: document.getElementById("weapon-slot"),
        weaponDot: document.getElementById("weapon-dot"),
        boostInfo: document.getElementById("boost-info"),
        evoName: document.getElementById("evo-name"),
        evoKills: document.getElementById("evo-kills"),
        evoNext: document.getElementById("evo-next"),
        bombCount: document.getElementById("bomb-count"),
        bombBtn: document.getElementById("bomb-btn"),
        soundBtn: document.getElementById("sound-btn"),
        comboWrap: document.getElementById("combo-wrap"),
        combo: document.getElementById("hud-combo"),
        coins: document.getElementById("hud-coins"),
        shopScreen: document.getElementById("shop-screen"),
        shopCoins: document.getElementById("shop-coins"),
        shopShips: document.getElementById("shop-ships"),
        shopUnlocks: document.getElementById("shop-unlocks"),
        startCoins: document.getElementById("start-coins"),
        startShip: document.getElementById("start-ship"),
      };

      let W = 0, H = 0, DPR = 1;
      function resize() {
        const r = stage.getBoundingClientRect();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(280, r.width);
        H = Math.max(320, r.height);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener("resize", resize);

      /* ============================================================
         音效系统（WebAudio 全合成，无外部文件）
         按经典街机射击的思路分层：每种武器一种标志性音色、
         爆炸分小/大/玩家三种、Boss 出场有警笛+低音轰鸣的专属入场乐。
         ============================================================ */
      let audioCtx = null, muted = false, masterGain = null, noiseBuf = null;
      function ac() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            const comp = audioCtx.createDynamicsCompressor();
            comp.threshold.value = -10; comp.ratio.value = 8;
            masterGain.connect(comp); comp.connect(audioCtx.destination);
            const len = Math.floor(audioCtx.sampleRate * 1);
            noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }
      function out() { return masterGain || (audioCtx && audioCtx.destination); }
      function tone(freq, dur, opts) {
        if (muted) return;
        const a = ac(); if (!a) return;
        opts = opts || {};
        const t = a.currentTime + (opts.delay || 0);
        const o = a.createOscillator(), g = a.createGain();
        o.type = opts.type || "square";
        o.frequency.setValueAtTime(freq, t);
        if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slideTo), t + dur);
        const vol = (opts.vol || 0.05) * (opts.mus ? 1 : 1.8); // 音效整体加重 1.8 倍求冲击力，背景音乐不放大
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(out());
        o.start(t); o.stop(t + dur + 0.03);
      }
      function noiseHit(dur, opts) {
        if (muted) return;
        const a = ac(); if (!a) return;
        opts = opts || {};
        const t = a.currentTime + (opts.delay || 0);
        const src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        src.playbackRate.value = 0.7 + Math.random() * 0.6;
        const f = a.createBiquadFilter();
        f.type = opts.filterType || "lowpass";
        f.frequency.setValueAtTime(opts.from || 900, t);
        if (opts.to) f.frequency.exponentialRampToValueAtTime(Math.max(30, opts.to), t + dur);
        f.Q.value = opts.q || 0.8;
        const g = a.createGain();
        const vol = (opts.vol || 0.16) * (opts.mus ? 1 : 1.8);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f); f.connect(g); g.connect(out());
        src.start(t); src.stop(t + dur + 0.03);
      }

        magnetLong:  { name: "强力磁芯", price: 250, icon: "磁", color: "#ff6b6b", desc: "磁铁道具持续时间从 6 秒延长到 12 秒，金币吸得更久更干净（磁铁只吸金币）。" },
        spreadStart: { name: "开局 S 弹", price: 350, icon: "S",  color: "#ffd23c", desc: "每局开局直接装备 S 散射炮 Lv.1。但这发开局 S 弹是一次性的：被击中打掉就没了，不会自动补回。" },
      };
      const UNLOCK_KEYS = Object.keys(UNLOCKS);
      const SAVE_KEY = "taiKongSheJiSaveV1";
      let save = { coins: 0, ship: "balanced", ownedShips: ["balanced"], unlocks: {} };
      function loadSave() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return;
          const d = JSON.parse(raw);
          if (!d || typeof d !== "object") return;
          save.coins = Math.max(0, Math.floor(Number(d.coins)) || 0);
          if (Array.isArray(d.ownedShips)) save.ownedShips = d.ownedShips.filter(k => SHIPS[k]);
          if (!save.ownedShips.includes("balanced")) save.ownedShips.unshift("balanced");
          save.ship = (SHIPS[d.ship] && save.ownedShips.includes(d.ship)) ? d.ship : "balanced";
          if (d.unlocks && typeof d.unlocks === "object") {
            for (const k of UNLOCK_KEYS) if (d.unlocks[k]) save.unlocks[k] = true;
          }
        } catch (e) { /* 本地存档不可用时按新档开局 */ }
      }
      function persistSave() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
      }
      function shipDef() { return SHIPS[save.ship] || SHIPS.balanced; }
      function magnetDuration() { return save.unlocks.magnetLong ? 12 : 6; }

      // 7 大星域（每 3 关一个）：背景色、星光色、敌机色相、音乐根音各不相同
      const ZONES = [
        { name: "翠绿星云", bg: ["#02120a", "#062315", "#0a2f1c"], star: "#d8ffe9", neb: "63,224,160",  hues: { basic: 152, weaver: 96,  diver: 45,  tank: 28  }, root: 110 },
        { name: "熔岩炼狱", bg: ["#140503", "#260a06", "#38100a"], star: "#ffe3cf", neb: "255,122,60",  hues: { basic: 12,  weaver: 36,  diver: 52,  tank: 350 }, root: 98 },
        { name: "冰晶星域", bg: ["#030b16", "#081c33", "#0d2c4d"], star: "#e6f7ff", neb: "120,200,255", hues: { basic: 199, weaver: 222, diver: 174, tank: 258 }, root: 123 },
        { name: "紫雾深渊", bg: ["#0d0316", "#1c0733", "#2a0d4d"], star: "#f2e2ff", neb: "177,140,255", hues: { basic: 276, weaver: 318, diver: 238, tank: 200 }, root: 87 },
        { name: "黄金荒漠", bg: ["#120c02", "#241a06", "#33250a"], star: "#fff3cf", neb: "255,205,80",  hues: { basic: 44,  weaver: 22,  diver: 84,  tank: 130 }, root: 104 },
        { name: "血色战场", bg: ["#14030a", "#26060f", "#380a18"], star: "#ffd9e2", neb: "255,84,112",  hues: { basic: 340, weaver: 20,  diver: 300, tank: 262 }, root: 92 },
        { name: "终焉虚空", bg: ["#05030f", "#0d0724", "#170b38"], star: "#e2e6ff", neb: "140,120,255", hues: { basic: 250, weaver: 190, diver: 322, tank: 48  }, root: 82 },
      ];
      function zoneOf(n) { return ZONES[Math.min(ZONES.length - 1, Math.floor((n - 1) / 3))]; }

      // 7 只 Boss（第 3/6/9/12/15/18/21 关），各有专属技能与卡通造型
      const BOSSES = [
        null,
        { name: "独眼巨碟", skill: "fan",    body: "ufo",    hue: 350, desc: "七向扇形弹幕" },
        { name: "螺旋章鱼", skill: "spiral", body: "octo",   hue: 276, desc: "旋转螺旋弹幕" },
        { name: "弹幕蜂后", skill: "summon", body: "bee",    hue: 44,  desc: "环形弹幕 + 召唤蜂群" },
        { name: "激光巨蟹", skill: "laser",  body: "crab",   hue: 16,  desc: "追踪锁定激光" },
        { name: "导弹堡垒龟", skill: "missile", body: "turtle", hue: 130, desc: "追踪导弹齐射" },
        { name: "双头魔龙", skill: "split",  body: "dragon", hue: 210, desc: "分裂弹幕" },
        { name: "终焉魔王", skill: "final",  body: "demon",  hue: 322, desc: "全部弹幕 · 狂暴模式" },
      ];

      // 7 只小 Boss（普通关结尾守关，7 种轮换）：血量远低于大 Boss，弹幕简单，
      // 但每只都有自己的卡通造型和专属子弹形状（bullet 为 drawBossBullet 的造型键）
      const MINI_BOSSES = [
        { name: "碟队长·小旋风", body: "miniUfo",  hue: 190, skill: "fan",    bullet: "bolt",   desc: "三向扇形闪电弹" },
        { name: "蝙蝠队长·夜翼", body: "miniBat",  hue: 268, skill: "aimed",  bullet: "bubble", desc: "连珠泡泡弹" },
        { name: "蜂刺将军·小针", body: "miniBee",  hue: 48,  skill: "ring",   bullet: "leaf",   desc: "带缺口的叶环弹" },
        { name: "甲壳先锋·铁头", body: "miniTank", hue: 24,  skill: "fan",    bullet: "gear",   desc: "齿轮扇形弹" },
        { name: "章鱼宝宝·小墨", body: "miniOcto", hue: 300, skill: "spiral", bullet: "heart",  desc: "旋转爱心弹" },
        { name: "螃蟹小将·钳钳", body: "miniCrab", hue: 8,   skill: "aimed",  bullet: "snow",   desc: "雪花双连弹" },
        { name: "星星魔像·闪闪", body: "miniStar", hue: 36,  skill: "ring",   bullet: "comet",  desc: "彗星环弹" },
      ];
      // 第 n 个普通关用第几只小 Boss（按普通关顺序轮换，第二轮血量随关卡自然变高）
      function miniBossDef(n) {
        let idx = 0;
        for (let i = 1; i < n; i++) if (i % 3 !== 0) idx++;
        return MINI_BOSSES[idx % MINI_BOSSES.length];
      }

      const player = {
        x: 0, y: 0, r: 15, hitR: 5.5, speed: 460,
        lives: 3, weaponType: "normal", weaponLv: 1, shield: 0, invuln: 0,
        fireTimer: 0, alive: true, tilt: 0,
      };
      let score = 0, level = 1, bombs = 0, flash = 0, warnT = 0, shakeT = 0;
      // 难度：影响敌机血量 / 开火间隔 / 弹速 / 得分倍率，开局前在开始界面选
      // 难度四档：初级 / 中级 / 高级 / 骨灰级。hp 敌机血量倍率、fire 敌方开火间隔倍率（越小越密）、
      // spd 敌弹速度倍率、score 得分倍率、coin 金币掉落倍率、lives 开局命数、density 敌潮密度倍率。
      // 难度越高奖励越好：骨灰级得分 ×2、金币 ×2.2，但敌机血量翻倍、弹幕又密又快、只有 2 条命。
      const DIFFS = {
        easy:   { name: "初级",   hp: 0.7,  fire: 1.35, spd: 0.88, score: 0.8, coin: 0.8, lives: 4, density: 0.85 },
        normal: { name: "中级",   hp: 1,    fire: 1,    spd: 1,    score: 1,   coin: 1,   lives: 3, density: 1 },
        hard:   { name: "高级",   hp: 1.4,  fire: 0.8,  spd: 1.12, score: 1.4, coin: 1.5, lives: 3, density: 1.2 },
        hell:   { name: "骨灰级", hp: 2,    fire: 0.62, spd: 1.28, score: 2,   coin: 2.2, lives: 2, density: 1.45 },
      };
      let difficulty = "normal";
      function diffDef() { return DIFFS[difficulty] || DIFFS.normal; }
      // 连击：2.5 秒内不断击坠就累加，每 10 连击倍率 +1（最高 ×5），被击中清零
      let combo = 0, comboTimer = 0, maxCombo = 0;
      function comboMult() { return 1 + Math.min(4, Math.floor(combo / 10)); }
      // 本局统计（结算展示）：开火数 / 命中数 / 磁铁剩余时间
      let shotsFired = 0, shotsHit = 0, magnetT = 0;
      // 限时增强道具：吃下后 BOOST_DURATION 秒内子弹威力翻倍、个头变大；重复吃刷新计时
      const BOOST_DURATION = 10;
      let boostT = 0, boostShownSec = -1;
      let startSpread = false; // 开局自带的那发 S 弹是否还在：一次性的，被击中打掉就没了
      function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
      // 变形系统：整局累计击坠数达到门槛，战机变形（机身变大、炮筒变多）
      let totalKills = 0, evoStage = 0;
      const EVO_STAGES = [
        { kills: 0,   name: "单筒战机", scale: 1.0,  lanes: [0] },
        { kills: 25,  name: "双筒战机", scale: 1.12, lanes: [-8, 8] },
        { kills: 60,  name: "三筒战机", scale: 1.24, lanes: [-12, 0, 12] },
        { kills: 110, name: "四筒战机", scale: 1.38, lanes: [-15, -5, 5, 15] },
        { kills: 180, name: "五筒旗舰", scale: 1.55, lanes: [-18, -9, 0, 9, 18] },
      ];
      function evoDef() { return EVO_STAGES[evoStage]; }
      let bullets = [], enemyBullets = [], enemies = [], particles = [], powerups = [], floaters = [], beams = [], coins = [];
      let coinsRun = 0; // 本局拾到的金币数（结算展示）
      let stars = [], nebulas = [];
      let spawnQueue = 0, spawnTimer = 0, levelResolved = 0, levelTarget = 0;
      let boss = null, finaleSpawned = false, finaleBig = false, waveTarget = 0, clearTimer = 0, timeAlive = 0, winPending = false;
      let keys = {}, pointer = null, lastTime = 0;

      function initStars() {
        stars = [];
        for (let i = 0; i < 110; i++) {
          stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + 0.4, v: 26 + Math.random() * 90, tw: Math.random() * Math.PI * 2 });
        }
        nebulas = [];
        for (let i = 0; i < 3; i++) {
          nebulas.push({ x: Math.random() * W, y: Math.random() * H, r: 130 + Math.random() * 150, v: 5 + Math.random() * 7 });
        }
      }

      function resetGame() {
        score = 0; level = 1; flash = 0; warnT = 0; shakeT = 0; timeAlive = 0; winPending = false;
        combo = 0; comboTimer = 0; maxCombo = 0; shotsFired = 0; shotsHit = 0; magnetT = 0; boostT = 0; boostShownSec = -1;
        coinsRun = 0;
        // 机库配置生效：铁壁型多 1 条命、疾风型判定更小；功能解锁决定开局闪光弹与开局武器
        bombs = save.unlocks.flashStart ? 1 : 0;
        player.lives = diffDef().lives + shipDef().extraLives;
        player.hitR = shipDef().hitR || (save.ship === "swift" ? 4.2 : 5.5);
        player.weaponType = save.unlocks.spreadStart ? "spread" : "normal"; player.weaponLv = 1; player.shield = 0; player.invuln = 0;
        startSpread = player.weaponType === "spread";
        totalKills = 0; evoStage = 0; player.r = 15;
        player.alive = true;
        player.x = W / 2; player.y = H - 110;
        bullets = []; enemyBullets = []; enemies = []; particles = []; powerups = []; floaters = []; beams = []; coins = [];
        boss = null;
        startLevel(1, true);
        updateHUD();
      }

      function startLevel(n, first) {
        level = n;
        levelResolved = 0;
        finaleBig = (n % 3 === 0);
        finaleSpawned = false;
        boss = null;
        enemies = [];
        bullets = bullets.filter(b => b.friendly);
        enemyBullets = [];
        beams = [];
        music.root = zoneOf(n).root;
        // 关卡拉长：敌潮数量明显增加，先清完敌潮，结尾再迎战守关 Boss（普通关小 Boss，每 3 关大 Boss）
        waveTarget = Math.round((finaleBig ? 22 + n * 5 : 34 + n * 7) * diffDef().density);
        levelTarget = waveTarget + 1; // 进度最后一格是守关 Boss
        spawnQueue = waveTarget;
        spawnTimer = 0.4;
        announce("第 " + n + " 关", zoneOf(n).name, false);
        // 凤凰型：每过一关回复 1 条命（上限 6）
        if (!first && shipDef().regen && player.lives < 6) { player.lives++; addFloater(player.x, player.y - 40, "生命 +1", "#ff9d3c"); }
        if (!first) sfx.level();
        el.level.textContent = "第 " + n + " / " + TOTAL_LEVELS + " 关";
        el.progressLabel.textContent = "本关进度";
        el.progressFill.classList.remove("boss");
        el.progressFill.classList.remove("mini");
        updateHUD();
      }

      /* ---------------- 敌机生成 ---------------- */
      function spawnBoss(n) {
        const bi = n / 3;
        const bd = BOSSES[bi];
        const hp = Math.round((170 + n * 62 + bi * 90) * diffDef().hp);
        boss = {
          kind: "boss", bossIndex: bi, skill: bd.skill, body: bd.body, hue: bd.hue, name: bd.name,
          x: W / 2, y: -80, r: 54,
          hp: hp, maxHp: hp, t: 0, fireTimer: 1.6, s1: 1.2, s2: 2.5, spiralA: 0,
          beam: null, beamCycle: 2.2, dir: 1, entered: false, score: 1500 + n * 300,
          flashT: 0, slowT: 0,
        };
        enemies.push(boss);
      }

      // 小 Boss：血量约为同关大 Boss 的四分之一，弹幕只有一招 + 慢速瞄准弹
      function spawnMiniBoss(n) {
        const md = miniBossDef(n);
        const hp = Math.round((60 + n * 17) * diffDef().hp);
        boss = {
          kind: "boss", isMini: true, skill: md.skill, body: md.body, hue: md.hue, name: md.name, bullet: md.bullet,
          x: W / 2, y: -60, r: 36,
          hp: hp, maxHp: hp, t: 0, fireTimer: 1.5, s1: 1.4, s2: 2.5, spiralA: 0,
          beam: null, dir: 1, entered: false, score: 600 + n * 80,
          flashT: 0, slowT: 0,
        };
        enemies.push(boss);
      }

      // 敌潮清完、场上无残敌时刷出守关 Boss，并把进度条切换成对应的血量条（小 Boss 橙 / 大 Boss 红）
      function spawnFinale() {
        finaleSpawned = true;
        if (finaleBig) {
          spawnBoss(level);
          const bd = BOSSES[level / 3];
          announce("⚠ 大 Boss " + bd.name + " 现身", bd.desc, true);
          sfx.bossIntro();
          warnT = 1.6;
          el.progressLabel.textContent = "大 Boss · " + bd.name + " 血量";
          el.progressFill.classList.add("boss");
          el.progressFill.classList.remove("mini");
        } else {
          spawnMiniBoss(level);
          const md = miniBossDef(level);
          announce("小 Boss 现身！", md.name + " · " + md.desc, false);
          sfx.warn();
          el.progressLabel.textContent = "小 Boss · " + md.name + " 血量";
          el.progressFill.classList.add("mini");
          el.progressFill.classList.remove("boss");
        }
        updateHUD();
      }
      function checkFinale() {
        if (state === STATE.PLAYING && !finaleSpawned && spawnQueue <= 0 && levelResolved >= waveTarget && enemies.length === 0) spawnFinale();
      }

      function spawnEnemy(forceKind, fx, fy) {
        const lv = level;
        let kind = forceKind;
        if (!kind) {
          const roll = Math.random();
          if (roll < 0.13 + lv * 0.006) kind = "tank";
          else if (roll < 0.40) kind = "weaver";
          else if (roll < 0.56 && lv >= 2) kind = "diver";
          else kind = "basic";
        }
        const x = fx !== undefined ? fx : 30 + Math.random() * (W - 60);
        const base = {
          x: x, y: fy !== undefined ? fy : -30, t: Math.random() * 10,
          fireTimer: 1 + Math.random() * 2.2, entered: false, flashT: 0, slowT: 0,
        };
        if (kind === "basic") Object.assign(base, { kind, r: 15, hp: 1 + Math.floor(lv / 5), maxHp: 1 + Math.floor(lv / 5), vy: 92 + lv * 6 + Math.random() * 30, vx: 0, score: 100 });
        if (kind === "weaver") Object.assign(base, { kind, r: 14, hp: 1 + Math.floor(lv / 6), maxHp: 1 + Math.floor(lv / 6), vy: 78 + lv * 5, amp: 46 + Math.random() * 40, score: 150 });
        if (kind === "diver") Object.assign(base, { kind, r: 13, hp: 1, maxHp: 1, vy: 172 + lv * 8, vx: 0, score: 200, locked: false });
        if (kind === "tank") Object.assign(base, { kind, r: 23, hp: 7 + lv * 2, maxHp: 7 + lv * 2, vy: 44 + lv * 3, vx: 0, score: 400 });
        // 难度缩放血量
        const dh = diffDef().hp;
        if (dh !== 1) { base.hp = Math.max(1, Math.round(base.hp * dh)); base.maxHp = base.hp; }
        // 精英怪：金色皇冠，血厚分高，击坠必掉道具（编队和 Boss 召唤的不算）
        if (!forceKind && kind !== "diver" && Math.random() < 0.05 + lv * 0.002) {
          base.elite = true;
          base.hp = base.maxHp = base.hp * 4 + 2;
          base.r = Math.round(base.r * 1.22);
          base.score *= 5;
          base.vy *= 0.88;
        }
        enemies.push(base);
        return base;
      }
      // 编队：一排小飞碟齐刷刷压下来
      function spawnFormation() {
        const n = 3 + Math.floor(Math.random() * 3);
        const gap = 46;
        const x0 = W / 2 + (Math.random() - 0.5) * (W - n * gap - 40) - ((n - 1) * gap) / 2;
        for (let i = 0; i < n; i++) spawnEnemy("basic", x0 + i * gap, -30 - Math.abs(i - (n - 1) / 2) * 14);
        return n;
      }

      /* ---------------- 道具 ---------------- */
      function dropPowerup(x, y, forceKind) {
        let kind = forceKind;
        if (!kind) {
          const table = [
            ["spread", 15], ["laser", 14], ["homing", 13], ["wave", 12], ["frost", 12],
            ["pulse", 9], ["plasma", 4], ["shield", 8], ["flash", 7], ["life", 3], ["magnet", 5], ["boost", 6],
          ];
          let sum = 0; for (const t of table) sum += t[1];
          let r = Math.random() * sum;
          kind = "spread";
          for (const t of table) { r -= t[1]; if (r <= 0) { kind = t[0]; break; } }
          if (kind === "life" && player.lives >= 5) kind = "shield";
        }
        powerups.push({ x, y, kind, r: 13, vy: 105, t: 0 });
      }

      /* ---------------- 金币：敌人爆出，飞散弹跳，碰到自动拾取 ---------------- */
      function dropCoins(x, y, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 60 + Math.random() * 190;
          coins.push({
            x: x + (Math.random() - 0.5) * 14, y: y + (Math.random() - 0.5) * 14,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
            r: 8, t: Math.random() * 2, phase: Math.random() * Math.PI * 2,
          });
        }
        if (coins.length > 260) coins.splice(0, coins.length - 260);
      }

      /* ---------------- HUD ---------------- */
      function updateHUD() {
        el.score.textContent = score.toLocaleString("zh-CN");
        if (el.coins) el.coins.textContent = "🪙 " + save.coins.toLocaleString("zh-CN");
        if (el.startCoins) el.startCoins.textContent = save.coins.toLocaleString("zh-CN");
        if (el.startShip) { el.startShip.textContent = shipDef().name; el.startShip.style.color = shipDef().color; }
        if (el.shopCoins) el.shopCoins.textContent = save.coins.toLocaleString("zh-CN");
        let hearts = "";
        for (let i = 0; i < Math.max(player.lives, 0); i++) hearts += "🚀";
        el.lives.innerHTML = hearts || "—";
        el.bombCount.textContent = bombs;
        el.bombBtn.disabled = bombs <= 0 || state !== STATE.PLAYING;
        const showCombo = combo >= 2;
        el.comboWrap.style.display = showCombo ? "" : "none";
        if (showCombo) {
          el.combo.textContent = combo + " · ×" + comboMult();
          el.comboWrap.classList.toggle("hot", comboMult() >= 3);
        }
        // 普通子弹是默认状态，不是道具：武器栏不显示任何子弹名字和等级，只留一个灰色小点占位；
        // 只有吃到七种特殊子弹后，才显示对应子弹的名字和叠加等级。
        const isNormal = !WEAPONS[player.weaponType];
        const wdef = WEAPONS[player.weaponType];
        if (el.weaponSlot) el.weaponSlot.style.display = isNormal ? "none" : "";
        if (el.weaponDot) el.weaponDot.style.display = isNormal ? "inline-block" : "none";
        if (!isNormal && wdef) {
          el.weaponName.textContent = wdef.name;
          el.weaponName.style.color = wdef.color;
          el.weaponLv.textContent = "Lv." + player.weaponLv + (player.weaponLv >= 6 ? " 无上限叠加" : "");
          const pips = el.weaponPips.children;
          for (let i = 0; i < pips.length; i++) {
            pips[i].style.background = i < Math.min(5, player.weaponLv) ? wdef.color : "#22334f";
          }
        } else {
          el.weaponName.textContent = "";
          el.weaponLv.textContent = "";
        }
        if (el.boostInfo) {
          const on = boostT > 0;
          el.boostInfo.classList.toggle("on", on);
          if (on) el.boostInfo.textContent = "⚡ 威力翻倍 " + Math.ceil(boostT) + "s";
        }

        el.evoNext.textContent = evoStage >= EVO_STAGES.length - 1
          ? " · 终极形态"
          : " · 再击坠 " + (EVO_STAGES[evoStage + 1].kills - totalKills) + " 架变形";
        if (boss) {
          el.progressFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + "%";
        } else {
          el.progressFill.style.width = Math.min(100, (levelResolved / Math.max(1, levelTarget)) * 100) + "%";

      }

      let announceTimer = null;
      function announce(main, sub, warn) {

      /* ---------------- 特效 ---------------- */
      function explode(x, y, color, n, power) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = (40 + Math.random() * 190) * (power || 1);
          particles.push({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.35 + Math.random() * 0.5, maxLife: 0.85,
            size: 1.5 + Math.random() * 3.2, color,
          });

      function addFloater(x, y, text, color) {
