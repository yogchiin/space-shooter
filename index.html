      }

      /* ============================================================
         玩家射击：七种武器 × 无限叠加（同种吃得越多等级越高，无上限）。
         等级越高：子弹更大、数量更多、伤害更高、特效（拖尾/光晕/溅射）越强。
         限时增强期间：所有子弹威力翻倍、个头 ×1.55，并带金色光晕。
         ============================================================ */
      function playerShoot(dt) {
        player.fireTimer -= dt;
        if (player.fireTimer > 0) return;
        const bulletsBefore = bullets.length;
        shootNow();
        player.fireTimer *= shipDef().fireMul; // 重炮型射速稍慢
        shotsFired += bullets.length - bulletsBefore;
      }
      function shootNow() {
        const st = evoDef();
        const lv = player.weaponLv;
        const k = 1.14 * st.scale;
        const muzzleY = lx => player.y + (-22 + Math.abs(lx) * 0.55) * k;
        const type = player.weaponType;
        // 无上限叠加：Lv.5 之后每再吃同种，伤害/个头/数量继续涨（数量与个头设软上限防满屏卡顿，伤害不封顶）
        const over = Math.max(0, lv - 5);
        const extraDmg = Math.floor(over / 2);
        // 限时增强：威力翻倍 + 个头变大；重炮型战机再叠伤害倍率
        const boosted = boostT > 0;
        const dmgMul = (boosted ? 2 : 1) * shipDef().dmgMul;
        const sizeMul = boosted ? 1.55 : 1;
        if (type === "spread") {
          player.fireTimer = Math.max(0.19, 0.26 - over * 0.006);
          const n = Math.min(5 + lv * 2, 27);
          const arc = Math.min(1.1 + lv * 0.09, 1.85);
          for (let i = 0; i < n; i++) {
            const a = (n === 1 ? 0 : (i / (n - 1) - 0.5) * arc) - Math.PI / 2;
            const center = Math.abs(i - (n - 1) / 2) < 1;
            bullets.push({ x: player.x, y: muzzleY(0), vx: Math.cos(a) * 660, vy: Math.sin(a) * 660, r: Math.min(2.8 + lv * 0.55, 7.5) * sizeMul, friendly: true, kind: "spread", dmg: ((center && lv >= 4 ? 2 : 1) + extraDmg) * dmgMul, lv, boosted, rot: Math.random() * Math.PI * 2, spin: (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 4), t: 0 });
          }
          sfx.shootSpread(lv);
        } else if (type === "laser") {
          player.fireTimer = Math.max(0.085, 0.12 - over * 0.004);
          for (const lx of st.lanes) {
            bullets.push({ x: player.x + lx * k, y: muzzleY(lx), vx: 0, vy: -900, r: Math.min(4.2 + lv * 1.05, 11) * sizeMul, friendly: true, kind: "laser", dmg: (1 + Math.floor(lv / 2)) * dmgMul, pierce: true, hitSet: new Set(), lv, boosted });
          }
          sfx.shootLaser(lv);
        } else if (type === "homing") {
          player.fireTimer = Math.max(0.24, 0.32 - over * 0.008);
          const n = Math.min(1 + lv + Math.floor(evoStage / 2), 9);
          for (let i = 0; i < n; i++) {
            const lx = st.lanes[i % st.lanes.length];
            bullets.push({ x: player.x + lx * k, y: muzzleY(lx) + 8, vx: i % 2 === 0 ? -80 : 80, vy: -430, r: Math.min(4.4 + lv * 0.4, 8) * sizeMul, friendly: true, kind: "homing", dmg: (2 + extraDmg) * dmgMul, speed: 480 + Math.min(90, over * 9), turn: 5 + Math.min(3, lv * 0.35), t: 0, lv, boosted });
          }
          sfx.shootHoming(lv);
        } else if (type === "plasma") {
          player.fireTimer = Math.max(0.34, 0.44 - over * 0.01);
          for (const lx of st.lanes) {
            bullets.push({ x: player.x + lx * k, y: muzzleY(lx), vx: 0, vy: -505, r: Math.min(8 + lv * 1.7, 20) * sizeMul, friendly: true, kind: "plasma", dmg: (3 + lv) * dmgMul, pierce: true, hitSet: new Set(), splash: Math.min(38 + lv * 9, 110), splashDmg: (1 + Math.floor(lv / 2)) * dmgMul, lv, boosted });
          }
          sfx.shootPlasma(lv);
        } else if (type === "wave") {
          player.fireTimer = Math.max(0.14, 0.19 - over * 0.005);
          // 波纹弹：子弹蛇行前进并逐渐变大；等级越高每筒波数越多（最高 5 波）
          const per = Math.min(1 + Math.floor(lv / 3), 5);
          for (const lx of st.lanes) {
            for (let j = 0; j < per; j++) {
              const br = Math.min(3.4 + lv * 0.4, 7) * sizeMul;
              bullets.push({ x: player.x + lx * k, y: muzzleY(lx) - j * 10, vx: 0, vy: -560, r: br, baseR: br, friendly: true, kind: "wave", dmg: ((lv >= 4 ? 2 : 1) + extraDmg) * dmgMul, t: 0, phase: (lx * 0.7) + j * Math.PI * 0.66, lv, boosted });
            }
          }
          sfx.shootWave(lv);
        } else if (type === "frost") {
          player.fireTimer = Math.max(0.09, 0.13 - over * 0.004);
          for (const lx of st.lanes) {
            const shots = [{ a: 0 }];
            const pairs = Math.min(1 + Math.floor(lv / 3), 4);
            for (let pi = 1; pi <= pairs; pi++) { shots.push({ a: -0.09 * pi }, { a: 0.09 * pi }); }
            for (const s of shots) {
              bullets.push({ x: player.x + lx * k, y: muzzleY(lx), vx: Math.sin(s.a) * 780, vy: -Math.cos(s.a) * 780, r: Math.min(3 + lv * 0.35, 6.5) * sizeMul, friendly: true, kind: "frost", dmg: (1 + Math.floor(lv / 6)) * dmgMul, slowDur: Math.min(0.8 + lv * 0.3, 2.6), lv, boosted });
            }
          }
          sfx.shootFrost(lv);
        } else if (type === "pulse") {
          // P 脉冲弹（特殊子弹道具）：高速直射；Lv3 起两侧加斜射，伤害随等级无限提升
          player.fireTimer = Math.max(0.07, 0.155 - lv * 0.008);
          const dmg = ((lv >= 5 ? 3 : lv >= 3 ? 2 : 1) + extraDmg) * dmgMul;
          for (const lx of st.lanes) {
            bullets.push({ x: player.x + lx * k, y: muzzleY(lx), vx: 0, vy: -680, r: Math.min(3.3 + lv * 0.7, 9) * sizeMul, friendly: true, kind: "pulse", dmg, lv, boosted });
          }
          if (lv >= 3) {
            const sideR = Math.min(3 + lv * 0.6, 8.5) * sizeMul;
            bullets.push({ x: player.x, y: muzzleY(0), vx: -105, vy: -665, r: sideR, friendly: true, kind: "pulse", dmg: Math.max(1, dmg - 1), lv, boosted });
            bullets.push({ x: player.x, y: muzzleY(0), vx: 105, vy: -665, r: sideR, friendly: true, kind: "pulse", dmg: Math.max(1, dmg - 1), lv, boosted });
          }
          if (lv >= 8) {
            const sideR2 = Math.min(3 + lv * 0.5, 8) * sizeMul;
            bullets.push({ x: player.x, y: muzzleY(0), vx: -210, vy: -640, r: sideR2, friendly: true, kind: "pulse", dmg: Math.max(1, dmg - 1), lv, boosted });
            bullets.push({ x: player.x, y: muzzleY(0), vx: 210, vy: -640, r: sideR2, friendly: true, kind: "pulse", dmg: Math.max(1, dmg - 1), lv, boosted });
          }
          sfx.shootPulse(lv);
        } else {
          // 普通子弹：没吃到任何子弹道具时的默认武器——朴素的小弹丸，
          // 不是道具（不掉落、不进道具栏、不上商店），也不能叠加升级
          player.fireTimer = 0.16;
          const nd = Math.max(1, Math.round(1 * dmgMul));
          for (const lx of st.lanes) {
            bullets.push({ x: player.x + lx * k, y: muzzleY(lx), vx: 0, vy: -640, r: 3.4 * sizeMul, friendly: true, kind: "normal", dmg: nd, lv: 1, boosted });
          }
          sfx.shootNormal();
        }
        // 双子型副炮：主武器每次开火，两侧副炮同步补两发脉冲弹
        if (shipDef().extraShots) {
          for (const sx of [-26, 26]) {
            bullets.push({ x: player.x + sx * k, y: player.y + 6, vx: 0, vy: -700, r: 3.4 * sizeMul, friendly: true, kind: "pulse", dmg: 1 * dmgMul, lv: 1, boosted });
          }
        }
      }

      /* ---------------- 敌方射击 ---------------- */
      function aimAngle(e) { return Math.atan2(player.y - e.y, player.x - e.x); }
      function pushEB(x, y, vx, vy, opts) {
        opts = opts || {};
        // Boss 系子弹（专属弹 / 导弹 / 分裂弹）速度随难度缩放；小兵子弹在 enemyShoot 里已缩放，不重复
        if (opts.kind === "boss" || opts.kind === "missile" || opts.kind === "split") {
          const sm = diffDef().spd;
          vx *= sm; vy *= sm;
          if (opts.speed) opts.speed *= sm;
        }
        enemyBullets.push(Object.assign({ x, y, vx, vy, r: 5, friendly: false, kind: "orb" }, opts));
      }
      function enemyShoot(e) {
        const a = aimAngle(e);
        const sp = (198 + level * 7) * diffDef().spd;
        pushEB(e.x, e.y + e.r * 0.7, Math.cos(a) * sp, Math.sin(a) * sp, { r: 5 });
        if (e.kind === "tank") {
          pushEB(e.x - 14, e.y + e.r * 0.6, Math.cos(a - 0.16) * sp, Math.sin(a - 0.16) * sp, { r: 5 });
          pushEB(e.x + 14, e.y + e.r * 0.6, Math.cos(a + 0.16) * sp, Math.sin(a + 0.16) * sp, { r: 5 });
        }
        sfx.enemyShoot();
      }
      /* ---- Boss 弹幕：全部留有可躲的空隙，速度克制，角度刁钻 ---- */
      function bossAimed(e, count, spreadArc, speed) {
        const base = aimAngle(e);
        for (let i = 0; i < count; i++) {
          const a = count === 1 ? base : base + (i / (count - 1) - 0.5) * spreadArc;
          pushEB(e.x, e.y + 30, Math.cos(a) * speed, Math.sin(a) * speed, { r: 3.8, kind: "boss", bossBody: e.body, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function bossFan(e) {
        // 五向扇形：正对玩家方向展开，弹与弹之间留出宽缝，随便挑一条都能钻过去
        const base = aimAngle(e);
        for (let i = 0; i < 5; i++) {
          const a = base + (i - 2) * 0.30;
          pushEB(e.x, e.y + 34, Math.cos(a) * 162, Math.sin(a) * 162, { r: 3.8, kind: "boss", bossBody: e.body, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function bossSpiral(e, arms) {
        const sp = 126;
        for (let i = 0; i < arms; i++) {
          const a = e.spiralA + (i * Math.PI * 2) / arms;
          pushEB(e.x + Math.cos(a) * 26, e.y + Math.sin(a) * 26, Math.cos(a) * sp, Math.sin(a) * sp, { r: 3.5, kind: "boss", bossBody: e.body, bossHue: e.hue });
        }
        e.spiralA += 0.52;
      }
      function bossRing(e) {
        // 环形弹幕：在朝向玩家的一侧留出缺口，永远有路可逃
        const gapA = aimAngle(e);
        const n = 12;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          let diff = Math.atan2(Math.sin(a - gapA), Math.cos(a - gapA));
          if (Math.abs(diff) < 0.66) continue;
          pushEB(e.x, e.y, Math.cos(a) * 114, Math.sin(a) * 114, { r: 3.5, kind: "boss", bossBody: e.body, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function bossMissiles(e, n) {
        for (let i = 0; i < n; i++) {
          const side = i % 2 === 0 ? -1 : 1;
          pushEB(e.x + side * 40, e.y + 16, side * 60, 118, { r: 4.6, kind: "missile", homing: true, speed: 150, turn: 1.6, life: 3.4, bossBody: e.body, bossHue: e.hue });
        }
        sfx.missileLaunch();
      }
      function bossSplitShot(e) {
        const base = aimAngle(e);
        [-0.17, 0.17].forEach(off => {
          pushEB(e.x, e.y + 30, Math.cos(base + off) * 140, Math.sin(base + off) * 140, { r: 6.2, kind: "split", splitT: 1.05, bossBody: e.body, bossHue: e.hue });
        });
        sfx.bossShoot();
      }
      function splitOrb(b) {
        const base = Math.atan2(b.vy, b.vx);
        for (let i = 0; i < 4; i++) {
          const a = base + (i - 1.5) * 0.46;
          pushEB(b.x, b.y, Math.cos(a) * 126, Math.sin(a) * 126, { r: 2.9, kind: "boss", bossBody: b.bossBody, bossHue: b.bossHue });
        }
        explode(b.x, b.y, "#c792ff", 6, 0.6);
        sfx.splitPop();
      }
      function bossAttack(e, dt) {
        const enraged = e.hp < e.maxHp * 0.35;
        const rateMul = enraged ? 0.82 : 1;
        // 通用瞄准射击（所有 Boss 都有，低血量变三连）
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          e.fireTimer = (enraged ? 1.3 : 1.75) * (0.9 + Math.random() * 0.2) * diffDef().fire;
          bossAimed(e, enraged ? 3 : 1, 0.38, 186 + level * 3);
        }
        const sk = e.skill;
        if (sk === "fan" || sk === "final") {
          e.s1 -= dt;
          if (e.s1 <= 0) { e.s1 = 1.65 * rateMul * diffDef().fire; bossFan(e); }
        }
        if (sk === "spiral" || sk === "final") {
          e.s2 -= dt;
          if (e.s2 <= 0) { e.s2 = 0.17; bossSpiral(e, e.hp < e.maxHp * 0.5 ? 3 : 2); }
        }
        if (sk === "summon" || sk === "final") {
          e.summonT = (e.summonT === undefined ? 2.2 : e.summonT) - dt;
          if (e.summonT <= 0) {
            e.summonT = (sk === "final" ? 5.4 : 4.3) * diffDef().fire;
            bossRing(e);
            if (enemies.length < 6) { spawnEnemy("weaver", e.x - 70, e.y + 10); spawnEnemy("weaver", e.x + 70, e.y + 10); }
          }
        }
        if (sk === "laser" || sk === "final") {
          updateBossBeam(e, dt);
        }
        if (sk === "missile") {
          e.s1 -= dt;
          if (e.s1 <= 0) { e.s1 = 2.05 * rateMul * diffDef().fire; bossMissiles(e, enraged ? 3 : 2); }
        }
        if (sk === "split") {
          e.s1 -= dt;
          if (e.s1 <= 0) { e.s1 = 1.95 * rateMul * diffDef().fire; bossSplitShot(e); }
          e.s2 -= dt;
          if (e.s2 <= 0) { e.s2 = 4.4 * diffDef().fire; bossRing(e); }
        }
      }
      /* ---- 小 Boss 弹幕：只有一招专属 + 慢速瞄准弹，密度和速度都明显低于大 Boss ---- */
      function miniAimed(e, count) {
        const base = aimAngle(e);
        const sp = 172 + level * 2;
        for (let i = 0; i < count; i++) {
          const a = count === 1 ? base : base + (i - 0.5) * 0.24;
          pushEB(e.x, e.y + 22, Math.cos(a) * sp, Math.sin(a) * sp, { r: 4, kind: "boss", bossBody: e.bullet, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function miniFan(e) {
        // 三向扇形：间隔宽，随便一条缝都能钻
        const base = aimAngle(e);
        for (let i = 0; i < 3; i++) {
          const a = base + (i - 1) * 0.36;
          pushEB(e.x, e.y + 24, Math.cos(a) * 152, Math.sin(a) * 152, { r: 4, kind: "boss", bossBody: e.bullet, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function miniRing(e) {
        // 小环形：只有 10 发，朝玩家一侧留大缺口
        const gapA = aimAngle(e);
        const n = 10;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          let diff = Math.atan2(Math.sin(a - gapA), Math.cos(a - gapA));
          if (Math.abs(diff) < 0.72) continue;
          pushEB(e.x, e.y, Math.cos(a) * 106, Math.sin(a) * 106, { r: 3.8, kind: "boss", bossBody: e.bullet, bossHue: e.hue });
        }
        sfx.bossShoot();
      }
      function miniSpiral(e) {
        const a = e.spiralA;
        pushEB(e.x + Math.cos(a) * 18, e.y + Math.sin(a) * 18, Math.cos(a) * 118, Math.sin(a) * 118, { r: 3.8, kind: "boss", bossBody: e.bullet, bossHue: e.hue });
        e.spiralA += 0.62;
      }
      function miniAttack(e, dt) {
        const enraged = e.hp < e.maxHp * 0.35;
        const rateMul = enraged ? 0.85 : 1;
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          e.fireTimer = (enraged ? 1.5 : 1.95) * (0.9 + Math.random() * 0.2) * diffDef().fire;
          miniAimed(e, enraged ? 2 : 1);
        }
        e.s1 -= dt;
        if (e.s1 <= 0) {
          if (e.skill === "fan") { e.s1 = 2.3 * rateMul * diffDef().fire; miniFan(e); }
          else if (e.skill === "ring") { e.s1 = 3.4 * rateMul * diffDef().fire; miniRing(e); }
          else if (e.skill === "spiral") { e.s1 = 0.36; miniSpiral(e); }
          else { e.s1 = 2.1 * rateMul * diffDef().fire; miniAimed(e, 2); }
        }
      }
      // 激光技能：预警线（可读）→ 短暂锁定 → 发射；发射只持续 0.6 秒，躲开预警线即可
      function updateBossBeam(e, dt) {
        if (!e.beam) {
          e.beamCycle -= dt;
          if (e.beamCycle <= 0) {
            e.beam = { phase: "tele", t: 0.85, angle: aimAngle(e), x: e.x, y: e.y + 34 };
            sfx.laserCharge();
          }
          return;
        }
        const bm = e.beam;
        bm.x = e.x; bm.y = e.y + 34;
        bm.t -= dt;
        if (bm.phase === "tele") {
          if (bm.t > 0.35) bm.angle = aimAngle(e); // 最后 0.35 秒锁定，留出走位时间
          if (bm.t <= 0) { bm.phase = "fire"; bm.t = 0.5; sfx.laserFire(); }
        } else {
          // 发射中判定
          if (player.alive && player.invuln <= 0) {
            const dx = player.x - bm.x, dy = player.y - bm.y;
            const proj = dx * Math.cos(bm.angle) + dy * Math.sin(bm.angle);
            const perp = Math.abs(-dx * Math.sin(bm.angle) + dy * Math.cos(bm.angle));
            if (proj > 0 && proj < H * 1.3 && perp < 8 + player.hitR) hitPlayer();
          }
          if (Math.random() < 0.5) {
            const d = Math.random() * H * 0.8;
            particles.push({ x: bm.x + Math.cos(bm.angle) * d, y: bm.y + Math.sin(bm.angle) * d, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 0.25, maxLife: 0.25, size: 2, color: "#ff8a7a" });
          }
          if (bm.t <= 0) { e.beam = null; e.beamCycle = e.skill === "final" ? 5.2 : 3.9; }
        }
        if (e.beam) beams = [e.beam]; else beams = [];
      }

      /* ---------------- 闪光弹（清屏）：开局没有，只能吃道具获得 ---------------- */
      function useBomb() {
        if (state !== STATE.PLAYING || bombs <= 0) return;
        bombs--;
        flash = 0.55;
        shakeT = 0.3;
        buzz(45);
        sfx.bomb();
        enemies.slice().forEach(e => {
          if (e.kind === "boss") { damageEnemy(e, e.isMini ? 25 : 45); }
          else killEnemy(e, true);
        });
        enemyBullets = [];
        toast("闪光弹释放！全屏清除");
        updateHUD();
      }

      /* ---------------- 伤害与击毁 ---------------- */
      function damageEnemy(e, dmg) {
        e.hp -= dmg;
        e.flashT = 0.08;
        if (e.hp <= 0) killEnemy(e, false);
        else sfx.enemyHit();
      }
      function checkEvolution() {
        while (evoStage < EVO_STAGES.length - 1 && totalKills >= EVO_STAGES[evoStage + 1].kills) {
          evoStage++;
          const st = evoDef();
          player.r = Math.round(15 * st.scale);
          announce("战机变形！", st.name + " · " + st.lanes.length + " 条弹道", false);
          sfx.evolve();
          explode(player.x, player.y, "#ffd23c", 34, 1.3);
          addFloater(player.x, player.y - 34, "变形！", "#ffd23c");
          updateHUD();
        }
      }
      function killEnemy(e, byBomb) {
        const idx = enemies.indexOf(e);
        if (idx === -1) return;
        enemies.splice(idx, 1);
        const big = e.kind === "tank" || e.kind === "boss";
        explode(e.x, e.y, e.kind === "boss" ? "#ff5470" : (e.kind === "tank" ? "#ffb340" : "#3fe0ff"), big ? 46 : 16, big ? 1.6 : 1);
        if (big) sfx.bigExplode();
        else sfx.explode();
        // 连击累加（闪光弹清屏也算），倍率与难度倍率一起结算
        combo++;
        comboTimer = 2.5;
        if (combo > maxCombo) maxCombo = combo;
        const mult = comboMult();
        const gained = Math.round(e.score * mult * diffDef().score);
        score += gained;
        totalKills++;
        checkEvolution();
        addFloater(e.x, e.y, "+" + gained, e.elite ? "#ffd23c" : (big ? "#ffb340" : "#9fdcff"));
        if (combo === 10 || combo === 25 || combo === 50 || combo === 100) {
          addFloater(player.x, player.y - 52, combo + " 连击！得分 ×" + mult, "#ff9d3c");
          sfx.weaponUp(Math.min(5, 1 + Math.floor(combo / 25)));
        }
        // 爆金币：小怪 1–3 枚，小 Boss 一堆（14 枚），大 Boss 一大堆（40 枚）
        if (e.kind === "boss") dropCoins(e.x, e.y, Math.round((e.isMini ? 14 : 40) * diffDef().coin));
        else dropCoins(e.x, e.y, Math.max(1, Math.round((1 + Math.floor(Math.random() * 3)) * diffDef().coin)));
        if (e.kind === "boss") buzz([50, 40, 90]);
        if (e.kind === "boss") {
          boss = null;
          beams = [];
          if (e.isMini) {
            // 小 Boss 掉落：一件随机道具，小概率再给一颗闪光弹
            flash = 0.3;
            shakeT = 0.3;
            dropPowerup(e.x, e.y);
            if (Math.random() < 0.45) dropPowerup(e.x + 26, e.y, "flash");
          } else {
            flash = 0.45;
            shakeT = 0.45;
            dropPowerup(e.x - 30, e.y, Math.random() < 0.3 ? "plasma" : WEAPON_KEYS[Math.floor(Math.random() * 6)]);
            dropPowerup(e.x + 30, e.y, "flash");
            if (Math.random() < 0.6) dropPowerup(e.x, e.y + 16, player.lives < 4 ? "life" : "shield");
          }
          levelResolved = levelTarget;
          if (level >= TOTAL_LEVELS) { winPending = true; beginClear(); }
          else beginClear();
        } else {
          levelResolved++;
          if (!byBomb && e.elite) dropPowerup(e.x, e.y);
          else if (!byBomb && Math.random() < 0.12) dropPowerup(e.x, e.y);
          checkFinale();
        }
        updateHUD();
      }

      function beginClear() {
        if (state !== STATE.PLAYING) return;
        state = STATE.CLEARING;
        clearTimer = 1.5;
        enemyBullets = [];
        beams = [];
        if (winPending) {
          announce("🎉 全关通关！", "21 关全部击破", false);
        } else {
          const bonus = Math.round((200 + level * 100) * diffDef().score);
          score += bonus;
          announce(finaleBig ? "大 Boss 击破！过关！" : "小 Boss 击破！过关！", "奖励 +" + bonus + " 分", false);
          sfx.level();
        }
        updateHUD();
      }

      function hitPlayer() {
        if (player.invuln > 0 || !player.alive) return;
        if (player.shield > 0) {
          player.shield = 0;
          player.invuln = 1.2;
          explode(player.x, player.y, "#b18cff", 18, 1);
          sfx.shieldBreak();
          toast("护盾挡下了一次攻击！");
          updateHUD();
          return;
        }
        player.lives--;
        player.invuln = 2;
        shakeT = 0.25;
        buzz(70);
        if (combo >= 10) addFloater(player.x, player.y - 46, "连击中断", "#ff5470");
        combo = 0; comboTimer = 0;
        // 开局 S 弹是一次性的：被击中打掉就直接没了，不降级保留、不会再自动补回来
        if (startSpread && player.weaponType === "spread") {
          startSpread = false;
          player.weaponType = "normal";
          player.weaponLv = 1;
          toast("被击中！开局 S 弹被打掉了");
          sfx.weaponDown();
        // 幽灵型相位装甲：被击中时武器不掉级、不丢失
        } else if (shipDef().keepWeapon) {
          toast("被击中！相位装甲保住了武器");
        // 被击中：武器先降一级；已是 Lv.1 的特殊武器则掉回默认的普通子弹
        } else if (player.weaponLv > 1) {
          player.weaponLv--;
          toast("被击中！武器降到 Lv." + player.weaponLv);
          sfx.weaponDown();
        } else if (player.weaponType !== "normal") {
          toast("被击中，" + WEAPONS[player.weaponType].name + "掉了！回到普通子弹");
          player.weaponType = "normal";
          sfx.weaponDown();
        }
        explode(player.x, player.y, "#ff5470", 30, 1.3);
        sfx.playerHit();
        if (player.lives <= 0) {
          player.alive = false;
          explode(player.x, player.y, "#ffb340", 60, 1.8);
          sfx.bigExplode();
          setTimeout(() => gameOver(false), 900);
        }
        updateHUD();
      }

      function gameOver(win) {
        state = STATE.OVER;
        music.stop();
        if (win) { sfx.victory(); el.overTitle.textContent = "🎉 通关成功！"; }
        else { sfx.gameOver(); el.overTitle.textContent = "战机坠毁"; }
        el.finalScore.textContent = score.toLocaleString("zh-CN");
        const acc = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
        const mm = Math.floor(timeAlive / 60), ss = String(Math.floor(timeAlive % 60)).padStart(2, "0");
        el.finalDetail.textContent = (win ? "21 关全部通关" : "坚持到第 " + level + " 关")
          + " · 难度 " + diffDef().name
          + " · 击坠 " + totalKills + " 架 · 最高连击 " + maxCombo
          + " · 命中率 " + acc + "% · 用时 " + mm + ":" + ss
          + " · 本局拾金币 +" + coinsRun + "（余额 " + save.coins + "）"
          + " · 战机 " + shipDef().name
          + " · 最终形态：" + evoDef().name + " · 武器 " + (WEAPONS[player.weaponType] ? WEAPONS[player.weaponType].name + " Lv." + player.weaponLv : "普通子弹");
        el.overScreen.classList.remove("hidden");
        updateHUD();
      }

      /* ---------------- 更新 ---------------- */
      function update(dt) {
        for (const s of stars) {
          s.y += s.v * dt * (state === STATE.PLAYING ? 1.6 : 0.6);
          s.tw += dt * 3;
          if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
        }
        for (const nb of nebulas) {
          nb.y += nb.v * dt;
          if (nb.y - nb.r > H) { nb.y = -nb.r; nb.x = Math.random() * W; }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.y -= 42 * dt; f.life -= dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
        if (flash > 0) flash = Math.max(0, flash - dt * 1.4);
        if (warnT > 0) warnT = Math.max(0, warnT - dt);
        if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
        if (magnetT > 0) magnetT = Math.max(0, magnetT - dt);
        if (boostT > 0) {
          boostT = Math.max(0, boostT - dt);
          const sec = Math.ceil(boostT);
          if (sec !== boostShownSec) { boostShownSec = sec; updateHUD(); }
          if (boostT <= 0) { toast("限时增强结束"); boostShownSec = -1; updateHUD(); }
        }
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0 && combo > 0) { combo = 0; updateHUD(); }
        }

        if (state === STATE.CLEARING) {
          clearTimer -= dt;
          updateEntities(dt, false);
          if (clearTimer <= 0) {
            if (winPending) { gameOver(true); }
            else { state = STATE.PLAYING; startLevel(level + 1, false); }
          }
          return;
        }
        if (state !== STATE.PLAYING) return;

        timeAlive += dt;
        if (player.invuln > 0) player.invuln -= dt;

        // 生成敌机：间隔随关卡缩短，时不时来一队编队
        if (!finaleSpawned && spawnQueue > 0) {
          spawnTimer -= dt;
          const gap = Math.max(0.34, 0.68 - level * 0.014) / diffDef().density;
          if (spawnTimer <= 0) {
            spawnTimer = gap * (0.7 + Math.random() * 0.6);
            if (Math.random() < 0.22 && spawnQueue >= 3) {
              const n = spawnFormation();
              spawnQueue -= Math.min(n, spawnQueue);
            } else {
              spawnEnemy();
              spawnQueue--;
              if (Math.random() < 0.3 && spawnQueue > 0) { spawnEnemy(); spawnQueue--; }
            }
          }
        }

        // 玩家移动：键盘
        let mx = 0, my = 0;
        if (keys["arrowleft"] || keys["a"]) mx -= 1;
        if (keys["arrowright"] || keys["d"]) mx += 1;
        if (keys["arrowup"] || keys["w"]) my -= 1;
        if (keys["arrowdown"] || keys["s"]) my += 1;
        if (mx || my) {
          const d = Math.hypot(mx, my);
          const spd = player.speed * shipDef().speedMul;
          player.x += (mx / d) * spd * dt;
          player.y += (my / d) * spd * dt;
          player.tilt = mx * 0.35;
          pointer = null;
        } else if (pointer) {
          const dx = pointer.x - player.x, dy = pointer.y - player.y;
          const dist = Math.hypot(dx, dy);
          const step = player.speed * shipDef().speedMul * 1.9 * dt;
          if (dist > 4) {
            const k = Math.min(1, step / dist);
            player.x += dx * k; player.y += dy * k;
          }
          player.tilt = Math.max(-0.4, Math.min(0.4, dx * 0.004));
        } else {
          player.tilt *= 0.85;
        }
        player.x = Math.max(player.r, Math.min(W - player.r, player.x));
        player.y = Math.max(player.r + 6, Math.min(H - player.r - 4, player.y));

        if (player.alive) playerShoot(dt);
        updateEntities(dt, true);
      }

      function updateEntities(dt, combat) {
        // 敌机
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.t += dt;
          if (e.flashT > 0) e.flashT -= dt;
          if (e.slowT > 0) e.slowT -= dt;
          const sf = e.slowT > 0 ? (e.kind === "boss" ? 0.72 : 0.45) : 1;
          if (e.kind === "boss") {
            const homeY = e.isMini ? 88 : 100;
            if (!e.entered) {
              e.y += 92 * dt;
              if (e.y >= homeY) { e.y = homeY; e.entered = true; }
            } else {
              const spd = e.skill === "final" ? 1.5 : 1;
              e.x += (Math.sin(e.t * 0.7) * 65 + e.dir * 12) * dt * sf * spd;
              if (e.x < e.r + 8) e.x = e.r + 8;
              if (e.x > W - e.r - 8) e.x = W - e.r - 8;
              e.y = homeY + Math.sin(e.t * 1.3) * (e.isMini ? 10 : 14);
              if (combat) { if (e.isMini) miniAttack(e, dt * sf); else bossAttack(e, dt * sf); }
            }
          } else if (e.kind === "weaver") {
            e.y += e.vy * dt * sf;
            e.x += Math.sin(e.t * 3.1) * e.amp * dt * 2.2 * sf;
          } else if (e.kind === "diver") {
            if (!e.locked && e.y > 60) { e.locked = true; e.vx = (player.x - e.x) * 0.9; }
            e.y += e.vy * dt * sf;
            e.x += (e.vx || 0) * dt * sf;
          } else {
            e.y += e.vy * dt * sf;
          }
          e.x = Math.max(10, Math.min(W - 10, e.x));
          if (e.kind !== "boss") {
            if (combat && e.y > 30) {
              e.fireTimer -= dt * sf;
              if (e.fireTimer <= 0) {
                e.fireTimer = ((e.kind === "tank" ? 1.5 : 2.3) + Math.random() * 1.4 - Math.min(0.5, level * 0.04)) * diffDef().fire;
                if (e.kind !== "diver") enemyShoot(e);
              }
            }
            if (e.y > H + 40) {
              enemies.splice(i, 1);
              if (!finaleSpawned && state === STATE.PLAYING) { levelResolved++; checkFinale(); updateHUD(); }
              continue;
            }
            if (combat && player.alive) {
              const d = Math.hypot(e.x - player.x, e.y - player.y);
              if (d < e.r * 0.82 + player.hitR) {
                damageEnemy(e, 99);
                hitPlayer();
                continue;
              }
            }
          }
        }

        // 玩家子弹
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.kind === "homing") {
            b.t += dt;
            let target = null, best = 1e9;
            for (const e of enemies) {
              const d = Math.hypot(e.x - b.x, e.y - b.y);
              if (d < best) { best = d; target = e; }
            }
            if (target) {
              const cur = Math.atan2(b.vy, b.vx);
              const want = Math.atan2(target.y - b.y, target.x - b.x);
              let diff = want - cur;
              while (diff > Math.PI) diff -= Math.PI * 2;
              while (diff < -Math.PI) diff += Math.PI * 2;
              const turn = Math.max(-(b.turn || 5.2) * dt, Math.min((b.turn || 5.2) * dt, diff));
              const na = cur + turn;
              b.vx = Math.cos(na) * b.speed; b.vy = Math.sin(na) * b.speed;
            }
            if (Math.random() < 0.6) particles.push({ x: b.x, y: b.y + 4, vx: (Math.random() - 0.5) * 20, vy: 60, life: 0.22, maxLife: 0.22, size: 1.8, color: "#ff8a3c" });
            if (b.t > 3.2) { bullets.splice(i, 1); continue; }
          }
          if (b.kind === "wave") {
            b.t += dt;
            b.x += Math.sin(b.t * 8 + b.phase) * 155 * dt;
            b.r = b.baseR + Math.min(3.5, b.t * 3.2);
            if (Math.random() < 0.25) particles.push({ x: b.x, y: b.y + 5, vx: 0, vy: 30, life: 0.2, maxLife: 0.2, size: 1.6, color: "#8f9dff" });
          }
          if (b.kind === "spread") {
            b.t = (b.t || 0) + dt;
            b.rot = (b.rot || 0) + (b.spin || 6) * dt;
            if (Math.random() < 0.35) particles.push({ x: b.x + (Math.random() - 0.5) * 4, y: b.y + (Math.random() - 0.5) * 4, vx: (Math.random() - 0.5) * 18, vy: 26, life: 0.22, maxLife: 0.22, size: 1.5, color: b.boosted ? "#ffe93c" : "#ffd23c" });
          }
          if (b.kind === "plasma" && Math.random() < 0.4) {
            particles.push({ x: b.x + (Math.random() - 0.5) * b.r, y: b.y + b.r * 0.7, vx: (Math.random() - 0.5) * 24, vy: 44, life: 0.26, maxLife: 0.26, size: 2, color: "#ff4dd8" });
          }
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.y < -18 || b.y > H + 18 || b.x < -18 || b.x > W + 18) { bullets.splice(i, 1); continue; }
          if (combat) {
            let consumed = false;
            for (const e of enemies) {
              if (b.pierce && b.hitSet.has(e)) continue;
              const d = Math.hypot(e.x - b.x, e.y - b.y);
              if (d < e.r + b.r) {
                const wasFrozen = e.slowT > 0;
                shotsHit++;
                damageEnemy(e, b.dmg || 1);
                if (b.kind === "frost" && enemies.indexOf(e) !== -1) {
                  e.slowT = Math.max(e.slowT, b.slowDur || 1);
                  if (!wasFrozen) sfx.freezeHit();
                }
                const hitColors = { laser: "#b6ffd2", plasma: "#ffc2f4", homing: "#ffd9ae", wave: "#ccd4ff", frost: "#e8fbff" };
                explode(b.x, b.y, hitColors[b.kind] || "#bfefff", b.kind === "pulse" || b.kind === "spread" ? 3 : 5, 0.5);
                if (b.splash) {
                  const near = enemies.filter(o => o !== e && Math.hypot(o.x - b.x, o.y - b.y) < b.splash + o.r);
                  near.forEach(o => { b.hitSet.add(o); damageEnemy(o, b.splashDmg || 2); });
                  explode(b.x, b.y, "#ff4dd8", 10, 0.9);
                }
                if (b.pierce) { b.hitSet.add(e); }
                else { consumed = true; }
                break;
              }
            }
            if (consumed) bullets.splice(i, 1);
          }
        }

        // 敌方子弹（普通弹 / Boss 能量弹 / 追踪导弹 / 分裂母弹）
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          if (b.homing) {
            b.life -= dt;
            const cur = Math.atan2(b.vy, b.vx);
            const want = Math.atan2(player.y - b.y, player.x - b.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const na = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, diff));
            b.vx = Math.cos(na) * b.speed; b.vy = Math.sin(na) * b.speed;
            if (Math.random() < 0.7) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.5) * 16, life: 0.2, maxLife: 0.2, size: 1.7, color: "#ffb066" });
            if (b.life <= 0) { explode(b.x, b.y, "#ff8a3c", 7, 0.7); enemyBullets.splice(i, 1); continue; }
          }
          if (b.kind === "split") {
            b.splitT -= dt;
            if (b.splitT <= 0) { enemyBullets.splice(i, 1); splitOrb(b); continue; }
          }
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.y < -16 || b.y > H + 16 || b.x < -16 || b.x > W + 16) { enemyBullets.splice(i, 1); continue; }
          if (combat && player.alive && player.invuln <= 0) {
            const d = Math.hypot(b.x - player.x, b.y - player.y);
            if (d < b.r + player.hitR) {
              enemyBullets.splice(i, 1);
              hitPlayer();
            }
          }
        }

        // 道具：磁吸对道具无效——武器道具、闪光弹道具都不受磁铁影响，只能自己飞过去吃
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          p.t += dt;
          p.y += p.vy * dt;
          p.x += Math.sin(p.t * 2.4) * 22 * dt;
          if (p.y > H + 20) { powerups.splice(i, 1); continue; }
          if (player.alive) {
            const d = Math.hypot(p.x - player.x, p.y - player.y);
            if (d < p.r + player.r + 6) {
              powerups.splice(i, 1);
              collectPowerup(p);
            }
          }
        }

        // 金币：爆出后先飞散弹跳（碰墙反弹、逐渐沉降），随后缓缓下飘等拾取；
        // 磁铁生效时只吸金币——全场金币直飞战机，道具纹丝不动
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          c.t += dt;
          if (magnetT > 0 && player.alive) {
            const dx = player.x - c.x, dy = player.y - c.y;
            const d = Math.hypot(dx, dy) || 1;
            const step = 580 * dt;
            c.x += (dx / d) * Math.min(step, d);
            c.y += (dy / d) * Math.min(step, d);
          } else {
            c.vx *= Math.max(0, 1 - 2.2 * dt);
            c.vy += (64 - c.vy) * 1.7 * dt; // 弹散劲头过后变成慢速下沉
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            // 弹跳：碰到左右和上边弹回来
            if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx) * 0.72; }
            if (c.x > W - c.r) { c.x = W - c.r; c.vx = -Math.abs(c.vx) * 0.72; }
            if (c.y < c.r) { c.y = c.r; c.vy = Math.abs(c.vy) * 0.6; }
          }
          if (c.y > H + 18) { coins.splice(i, 1); continue; }
          if (player.alive) {
            const d = Math.hypot(c.x - player.x, c.y - player.y);
            if (d < c.r + player.r + 5) {
              coins.splice(i, 1);
              save.coins++;
              coinsRun++;
              persistSave();
              sfx.coin();
              particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 30, vy: -40, life: 0.22, maxLife: 0.22, size: 2, color: "#ffcf3c" });
              updateHUD();
            }
          }
        }
      }

      function collectPowerup(p) {
        if (WEAPONS[p.kind]) {
          startSpread = false; // 吃到掉落的武器后按普通规则走，不再算「开局一次性 S 弹」
          const wdef = WEAPONS[p.kind];
          if (player.weaponType === p.kind) {
            // 同种无限叠加：没有满级，吃一个升一级
            player.weaponLv++;
            toast(wdef.name + " 叠加增强！Lv." + player.weaponLv);
            addFloater(player.x, player.y - 36, "Lv." + player.weaponLv + "!", wdef.color);
            sfx.weaponUp(Math.min(5, player.weaponLv));
          } else {
            player.weaponType = p.kind;
            player.weaponLv = 1;
            toast("换上 " + wdef.name + "！");
            const fn = { pulse: "powerPulse", spread: "powerSpread", laser: "powerLaser", homing: "powerHoming", plasma: "powerPlasma", wave: "powerWave", frost: "powerFrost" }[p.kind];
            sfx[fn](1);
          }
          explode(p.x, p.y, wdef.color, 14, 0.8);
        } else if (p.kind === "boost") {
          boostT = BOOST_DURATION;
          boostShownSec = -1;
          toast("限时增强！子弹威力翻倍 " + BOOST_DURATION + " 秒");
          addFloater(p.x, p.y - 10, "威力翻倍！", "#ffe93c");
          sfx.boostPickup();
          buzz(30);
          explode(p.x, p.y, "#ffe93c", 18, 1);
        } else if (p.kind === "flash") {
          bombs++;
          toast("获得闪光弹！⚡ ×" + bombs);
          addFloater(p.x, p.y - 10, "闪光弹 +1", "#ffb340");
          sfx.flashPickup();
          explode(p.x, p.y, "#ffb340", 12, 0.8);
        } else if (p.kind === "magnet") {
          magnetT = magnetDuration();
          toast("磁铁启动！" + magnetT + " 秒内只吸金币");
          addFloater(p.x, p.y - 10, "磁吸金币", "#ff6b6b");
          sfx.shieldUp();
          explode(p.x, p.y, "#ff6b6b", 12, 0.8);
        } else if (p.kind === "shield") {
          player.shield = 1;
          toast("护盾已激活");
          sfx.shieldUp();
          explode(p.x, p.y, "#b18cff", 10, 0.7);
        } else if (p.kind === "life") {
          player.lives = Math.min(5, player.lives + 1);
          toast("生命 +1！");
          sfx.powerLife();
          explode(p.x, p.y, "#ff5470", 10, 0.7);
        }
        updateHUD();
      }

      /* ============================================================
         绘制：全卡通造型——圆润渐变身体、大眼睛、描边、高光
         ============================================================ */
      function drawShip(x, y, tilt, invulnBlink) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(tilt || 0);
        ctx.scale(1.14 * evoDef().scale * shipDef().scaleMul, 1.14 * evoDef().scale * shipDef().scaleMul);
        if (invulnBlink) ctx.globalAlpha = 0.45;
        ctx.beginPath();
        ctx.ellipse(3, 6, 20, 17, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,.32)";
        ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 7;
        ctx.fill();
        ctx.shadowBlur = 0;
        // 尾焰
        const flame = 13 + Math.random() * 8;
        let fg = ctx.createRadialGradient(0, 15, 1, 0, 15 + flame * 0.5, flame);
        fg.addColorStop(0, "#fff6d8"); fg.addColorStop(0.35, "#ffc93c"); fg.addColorStop(1, "rgba(255,122,26,0)");
        ctx.beginPath();
        ctx.moveTo(-5.5, 13);
        ctx.quadraticCurveTo(-5, 15 + flame * 0.6, 0, 15 + flame);
        ctx.quadraticCurveTo(5, 15 + flame * 0.6, 5.5, 13);
        ctx.closePath();
        ctx.fillStyle = fg;
        ctx.fill();
        // 机翼
        const wing = ctx.createLinearGradient(0, -8, 0, 18);
        wing.addColorStop(0, "#57b8ff"); wing.addColorStop(0.55, "#2b82d8"); wing.addColorStop(1, "#155a9e");
        ctx.fillStyle = wing;
        ctx.strokeStyle = "#0d3f73"; ctx.lineWidth = 1.6; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-4, -8);
        ctx.quadraticCurveTo(-20, 2, -23, 10);
        ctx.quadraticCurveTo(-23.5, 14, -19, 14.5);
        ctx.lineTo(-7, 13);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(4, -8);
        ctx.quadraticCurveTo(20, 2, 23, 10);
        ctx.quadraticCurveTo(23.5, 14, 19, 14.5);
        ctx.lineTo(7, 13);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // 翼尖小圆舱
        [[-21, 11], [21, 11]].forEach(pt => {
          const pg = ctx.createRadialGradient(pt[0] - 1.5, pt[1] - 1.5, 0.5, pt[0], pt[1], 4.6);
          pg.addColorStop(0, "#ffe3ae"); pg.addColorStop(0.45, "#ffab3c"); pg.addColorStop(1, "#e56f12");
          ctx.beginPath(); ctx.arc(pt[0], pt[1], 4.4, 0, Math.PI * 2);
          ctx.fillStyle = pg; ctx.fill();
          ctx.strokeStyle = "#9c4a08"; ctx.lineWidth = 1; ctx.stroke();
        });
        // 两侧炮管
        const pod = ctx.createLinearGradient(0, 2, 0, 15);
        pod.addColorStop(0, "#eaf6ff"); pod.addColorStop(1, "#7fb2dd");
        ctx.fillStyle = pod; ctx.strokeStyle = "#3c74a8"; ctx.lineWidth = 1.1;
        [[-11.5], [11.5]].forEach(px => {
          ctx.beginPath();
          ctx.roundRect(px[0] - 2.6, 1, 5.2, 13, 2.6);
          ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(px[0], 1.5, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = "#274b6b"; ctx.fill();
          ctx.fillStyle = pod;
        });
        // 机身
        const body = ctx.createRadialGradient(-4, -13, 2, 0, -2, 26);
        body.addColorStop(0, "#ffffff"); body.addColorStop(0.38, "#d8efff");
        body.addColorStop(0.75, "#8ec9f2"); body.addColorStop(1, "#5ea3dd");
        ctx.beginPath();
        ctx.moveTo(0, -23);
        ctx.bezierCurveTo(6.5, -16, 8.5, -4, 8, 6);
        ctx.bezierCurveTo(7.6, 13, 4.5, 16.5, 0, 16.5);
        ctx.bezierCurveTo(-4.5, 16.5, -7.6, 13, -8, 6);
        ctx.bezierCurveTo(-8.5, -4, -6.5, -16, 0, -23);
        ctx.closePath();
        ctx.fillStyle = body; ctx.fill();
        ctx.strokeStyle = "#2c6ea8"; ctx.lineWidth = 1.5; ctx.stroke();
        // 机头橙色小帽
        ctx.beginPath();
        ctx.moveTo(0, -23);
        ctx.bezierCurveTo(3.4, -19.5, 4.6, -16.5, 4.9, -13.5);
        ctx.lineTo(-4.9, -13.5);
        ctx.bezierCurveTo(-4.6, -16.5, -3.4, -19.5, 0, -23);
        ctx.closePath();
        const cap = ctx.createLinearGradient(0, -23, 0, -13);
        cap.addColorStop(0, "#ffd98a"); cap.addColorStop(1, "#ff8a3c");
        ctx.fillStyle = cap; ctx.fill();
        // 火炮筒（随形态变多）
        const barrelG = ctx.createLinearGradient(0, -22, 0, -8);
        barrelG.addColorStop(0, "#ffffff"); barrelG.addColorStop(1, "#8fb8dd");
        for (const lx of evoDef().lanes) {
          const top = -21 + Math.abs(lx) * 0.55;
          ctx.beginPath();
          ctx.roundRect(lx - 2.3, top, 4.6, 11, 2.2);
          ctx.fillStyle = barrelG; ctx.fill();
          ctx.strokeStyle = "#3c74a8"; ctx.lineWidth = 1; ctx.stroke();
          ctx.beginPath(); ctx.arc(lx, top + 1.2, 1.7, 0, Math.PI * 2);
          ctx.fillStyle = "#1d3a56"; ctx.fill();
        }
        // 座舱玻璃罩
        const dome = ctx.createRadialGradient(-1.8, -9.5, 0.5, 0, -5, 8.5);
        dome.addColorStop(0, "#eaffff"); dome.addColorStop(0.35, "#6fe8ff");
        dome.addColorStop(0.8, "#18a8d8"); dome.addColorStop(1, "#0d6ea8");
        ctx.beginPath();
        ctx.ellipse(0, -5, 4.6, 7.6, 0, 0, Math.PI * 2);
        ctx.fillStyle = dome; ctx.fill();
        ctx.strokeStyle = "#0d5a8c"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(-1.7, -9, 1.5, 2.6, -0.4, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-4.6, -1, 1.3, 6.5, 0.25, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,.5)";
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 13.5, 5.4, 2.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(30,90,150,.35)";
        ctx.fill();
        // 受击判定点：只有机身正中心这一小颗核心中弹才掉血，擦着机翼机身过去不算
        ctx.beginPath();
        ctx.arc(0, -2, 3.1, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -2, 3.1, 0, Math.PI * 2);
        ctx.strokeStyle = "#ff5470"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, -2, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = "#ff5470";
        ctx.fill();
        ctx.restore();
        // 护盾
        if (player.shield > 0) {
          ctx.save();
          ctx.translate(x, y);
          ctx.beginPath();
          ctx.arc(0, 0, 26 * evoDef().scale + 6 + Math.sin(performance.now() / 180) * 2, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(177,140,255,.9)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "rgba(177,140,255,.09)";
          ctx.fill();
          ctx.restore();
        }
      }

      // 卡通眼睛：白眼球 + 会追踪玩家的瞳孔 + 高光点
      function cartoonEye(x, y, r, lookX, lookY, angry) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.strokeStyle = "rgba(20,20,40,.55)"; ctx.lineWidth = 1; ctx.stroke();
        const px = x + Math.max(-1, Math.min(1, lookX)) * r * 0.38;
        const py = y + Math.max(-1, Math.min(1, lookY)) * r * 0.38;
        ctx.beginPath(); ctx.arc(px, py, r * 0.52, 0, Math.PI * 2);
        ctx.fillStyle = "#1c2438"; ctx.fill();
        ctx.beginPath(); ctx.arc(px - r * 0.18, py - r * 0.18, r * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.fill();
        if (angry) {
          ctx.beginPath();
          ctx.moveTo(x - r * 0.9, y - r * 1.25); ctx.lineTo(x + r * 0.7, y - r * 0.75);
          ctx.strokeStyle = "#1c2438"; ctx.lineWidth = 1.6; ctx.stroke();
        }
      }
      function hsl(h, s, l, a) { return "hsla(" + h + "," + s + "%," + l + "%," + (a === undefined ? 1 : a) + ")"; }

      function drawEnemy(e) {
        const zone = zoneOf(level);
        const hue = zone.hues[e.kind] !== undefined ? zone.hues[e.kind] : 0;
        const flash = e.flashT > 0;
        const lookX = Math.max(-1, Math.min(1, (player.x - e.x) / 60));
        const lookY = Math.max(-1, Math.min(1, (player.y - e.y) / 60));
        ctx.save();
        ctx.translate(e.x, e.y);
        // 柔和投影
        ctx.beginPath(); ctx.ellipse(2, 5, e.r * 0.95, e.r * 0.8, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fill();

        if (e.kind === "basic") {
          // 小飞碟：玻璃罩里坐着一只独眼外星宝宝
          const saucer = ctx.createLinearGradient(0, 0, 0, 14);
          saucer.addColorStop(0, flash ? "#ffffff" : hsl(hue, 85, 68)); saucer.addColorStop(1, flash ? "#ffffff" : hsl(hue, 78, 42));
          ctx.beginPath(); ctx.ellipse(0, 6, 17, 7.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = saucer; ctx.fill();
          ctx.strokeStyle = hsl(hue, 70, 30); ctx.lineWidth = 1.4; ctx.stroke();
          // 碟沿小灯
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath(); ctx.arc(i * 10, 8.5, 2, 0, Math.PI * 2);
            ctx.fillStyle = Math.floor(e.t * 4 + i) % 2 === 0 ? "#ffe98a" : hsl(hue, 90, 75);
            ctx.fill();
          }
          // 玻璃罩 + 外星宝宝
          const domeG = ctx.createRadialGradient(-3, -10, 1, 0, -4, 13);
          domeG.addColorStop(0, "rgba(255,255,255,.85)"); domeG.addColorStop(0.5, "rgba(190,240,255,.35)"); domeG.addColorStop(1, "rgba(140,210,255,.18)");
          ctx.beginPath(); ctx.ellipse(0, -3, 10.5, 10, 0, Math.PI, Math.PI * 2);
          ctx.closePath(); ctx.fillStyle = domeG; ctx.fill();
          ctx.beginPath(); ctx.arc(0, -5, 6.4, 0, Math.PI * 2);
          ctx.fillStyle = flash ? "#fff" : "#9be15d"; ctx.fill();
          ctx.strokeStyle = "#4d8a2a"; ctx.lineWidth = 1.1; ctx.stroke();
          // 触角
          ctx.beginPath(); ctx.moveTo(0, -11.4); ctx.quadraticCurveTo(2, -14.5, 4.5, -14.8);
          ctx.strokeStyle = "#4d8a2a"; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.beginPath(); ctx.arc(5, -14.8, 1.7, 0, Math.PI * 2); ctx.fillStyle = "#ffd23c"; ctx.fill();
          cartoonEye(0, -5.5, 3.6, lookX, lookY, false);
          ctx.beginPath(); ctx.arc(0, -1.6, 1.6, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.strokeStyle = "#2c5a16"; ctx.lineWidth = 1.1; ctx.stroke();
        } else if (e.kind === "weaver") {
          // 蝙蝠怪：圆脑袋 + 扑扇的大翅膀 + 小尖牙
          const flap = Math.sin(e.t * 11) * 0.45;
          ctx.fillStyle = flash ? "#fff" : hsl(hue, 65, 38);
          ctx.strokeStyle = hsl(hue, 60, 24); ctx.lineWidth = 1.3; ctx.lineJoin = "round";
          [-1, 1].forEach(s => {
            ctx.save();
            ctx.scale(s, 1);
            ctx.rotate(-flap * 0.5);
            ctx.beginPath();
            ctx.moveTo(4, -2);
            ctx.quadraticCurveTo(16, -12, 21, -6);
            ctx.quadraticCurveTo(17, -2, 19, 3);
            ctx.quadraticCurveTo(14, 2, 13, 7);
            ctx.quadraticCurveTo(9, 4, 5, 5);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
          });
          const bg2 = ctx.createRadialGradient(-3, -6, 1, 0, 0, 16);
          bg2.addColorStop(0, flash ? "#fff" : hsl(hue, 85, 72)); bg2.addColorStop(1, flash ? "#fff" : hsl(hue, 75, 45));
          ctx.beginPath(); ctx.arc(0, 0, 13.5, 0, Math.PI * 2);
          ctx.fillStyle = bg2; ctx.fill();
          ctx.strokeStyle = hsl(hue, 65, 30); ctx.lineWidth = 1.5; ctx.stroke();
          // 尖耳朵
          ctx.fillStyle = flash ? "#fff" : hsl(hue, 75, 50);
          [[-8, -1], [8, 1]].forEach(pt => {
            ctx.beginPath();
            ctx.moveTo(pt[0] - 3.4, -9); ctx.lineTo(pt[0] + 1, -16.5); ctx.lineTo(pt[0] + 3.8, -8.4);
            ctx.closePath(); ctx.fill(); ctx.stroke();
          });
          cartoonEye(-5, -2, 3.4, lookX, lookY, true);
          cartoonEye(5, -2, 3.4, lookX, lookY, true);
          // 嘴 + 尖牙
          ctx.beginPath(); ctx.arc(0, 3.4, 4.6, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.strokeStyle = "#3a1030"; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.fillStyle = "#ffffff";
          [-2.6, 2.6].forEach(fx => {
            ctx.beginPath(); ctx.moveTo(fx - 1.3, 5.6); ctx.lineTo(fx + 1.3, 5.6); ctx.lineTo(fx, 8.6); ctx.closePath(); ctx.fill();
          });
        } else if (e.kind === "diver") {
          // 蜂刺怪：条纹胖身子 + 透明翅膀 + 朝下的毒刺
          const bg3 = ctx.createRadialGradient(-3, -5, 1, 0, 0, 15);
          bg3.addColorStop(0, flash ? "#fff" : hsl(hue, 95, 70)); bg3.addColorStop(1, flash ? "#fff" : hsl(hue, 88, 46));
          ctx.beginPath(); ctx.ellipse(0, 0, 11.5, 13.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = bg3; ctx.fill();
          ctx.strokeStyle = hsl(hue, 70, 30); ctx.lineWidth = 1.5; ctx.stroke();
          // 条纹
          ctx.save();
          ctx.beginPath(); ctx.ellipse(0, 0, 11.5, 13.5, 0, 0, Math.PI * 2); ctx.clip();
          ctx.fillStyle = "rgba(40,26,8,.55)";
          ctx.fillRect(-12, -6, 24, 3.6); ctx.fillRect(-12, 1.5, 24, 3.6); ctx.fillRect(-12, 8.5, 24, 3.4);
          ctx.restore();
          // 翅膀（快速扇动，半透明）
          ctx.fillStyle = "rgba(230,248,255,.55)";
          const wf = Math.sin(e.t * 26) * 2;
          ctx.beginPath(); ctx.ellipse(-9, -9 + wf * 0.4, 6.5, 3.2, -0.6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(9, -9 - wf * 0.4, 6.5, 3.2, 0.6, 0, Math.PI * 2); ctx.fill();
          cartoonEye(-4.4, -3.4, 3.1, lookX, lookY, true);
          cartoonEye(4.4, -3.4, 3.1, lookX, lookY, true);
          // 毒刺
          ctx.beginPath(); ctx.moveTo(-3.4, 12); ctx.lineTo(3.4, 12); ctx.lineTo(0, 19.5); ctx.closePath();
          ctx.fillStyle = "#39404f"; ctx.fill();
          ctx.strokeStyle = "#171c28"; ctx.lineWidth = 1; ctx.stroke();
        } else if (e.kind === "tank") {
          // 甲壳兽：大圆壳 + 斑点 + 独角 + 小短腿
          ctx.strokeStyle = hsl(hue, 55, 26); ctx.lineWidth = 2.4; ctx.lineCap = "round";
          const legSwing = Math.sin(e.t * 8) * 2.4;
          [-13, 13].forEach((lx, li) => {
            ctx.beginPath(); ctx.moveTo(lx, 10); ctx.lineTo(lx + (li === 0 ? -3 : 3), 17 + (li === 0 ? legSwing : -legSwing)); ctx.stroke();
          });
          const shell = ctx.createRadialGradient(-6, -10, 2, 0, 0, 26);
          shell.addColorStop(0, flash ? "#fff" : hsl(hue, 80, 66)); shell.addColorStop(0.6, flash ? "#fff" : hsl(hue, 72, 46)); shell.addColorStop(1, flash ? "#fff" : hsl(hue, 68, 32));
          ctx.beginPath(); ctx.ellipse(0, 0, 21.5, 19.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = shell; ctx.fill();
          ctx.strokeStyle = hsl(hue, 60, 24); ctx.lineWidth = 1.8; ctx.stroke();
          // 壳上斑点
          ctx.fillStyle = hsl(hue, 70, 30, 0.5);
          [[-9, -6, 4], [7, -10, 3.2], [11, 3, 4.4], [-12, 6, 3], [0, 8, 3.4]].forEach(sp => {
            ctx.beginPath(); ctx.arc(sp[0], sp[1], sp[2], 0, Math.PI * 2); ctx.fill();
          });
          // 独角
          ctx.beginPath(); ctx.moveTo(-3.6, -17); ctx.quadraticCurveTo(0, -27, 3.6, -17); ctx.closePath();
          const horn = ctx.createLinearGradient(0, -26, 0, -16);
          horn.addColorStop(0, "#fff3d6"); horn.addColorStop(1, "#e8a83c");
          ctx.fillStyle = flash ? "#fff" : horn; ctx.fill();
          ctx.strokeStyle = "#9c6a14"; ctx.lineWidth = 1.1; ctx.stroke();
          cartoonEye(-6.4, 1, 3.6, lookX, lookY, false);
          cartoonEye(6.4, 1, 3.6, lookX, lookY, false);
          ctx.beginPath(); ctx.arc(0, 7.6, 3.4, 1.15 * Math.PI, 1.85 * Math.PI);
          ctx.strokeStyle = "#40260a"; ctx.lineWidth = 1.4; ctx.stroke();
          // 血条
          ctx.restore();
          ctx.fillStyle = "rgba(255,255,255,.18)";
          ctx.fillRect(e.x - 22, e.y - e.r - 13, 44, 4);
          ctx.fillStyle = "#ffb340";
          ctx.fillRect(e.x - 22, e.y - e.r - 13, 44 * Math.max(0, e.hp / e.maxHp), 4);
          ctx.save(); ctx.translate(e.x, e.y);
        }
        // 精英怪：金色光环 + 小皇冠
        if (e.elite) {
          ctx.beginPath(); ctx.arc(0, 0, e.r + 2 + Math.sin(e.t * 5) * 1.2, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255,210,60,.85)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-7, -e.r - 3); ctx.lineTo(-7, -e.r - 10); ctx.lineTo(-3.5, -e.r - 5.5);
          ctx.lineTo(0, -e.r - 11); ctx.lineTo(3.5, -e.r - 5.5); ctx.lineTo(7, -e.r - 10); ctx.lineTo(7, -e.r - 3);
          ctx.closePath();
          ctx.fillStyle = "#ffcf4d"; ctx.fill();
          ctx.strokeStyle = "#9c6a14"; ctx.lineWidth = 1; ctx.stroke();
        }
        // 冰冻减速：覆一层冰霜
        if (e.slowT > 0) {
          ctx.beginPath(); ctx.arc(0, 0, e.r + 3, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(160,230,255,.30)"; ctx.fill();
          ctx.strokeStyle = "rgba(220,250,255,.85)"; ctx.lineWidth = 1.6; ctx.stroke();

            ctx.fill();
            ctx.restore();
          } else if (b.kind === "normal") {
            // 普通子弹：朴素的小白弹丸，不发光、不花哨——和七种特殊子弹一眼区分
            ctx.fillStyle = "#e8eef7";
            ctx.beginPath();
            ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 1.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.9)";
            ctx.beginPath();
            ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.4, b.r * 0.28, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // P 脉冲弹（特殊子弹）：青色发光胶囊
            ctx.fillStyle = "#c8f8ff";
            ctx.shadowColor = "#3fe0ff"; ctx.shadowBlur = 9;
            ctx.beginPath();
            ctx.ellipse(b.x, b.y, b.r * 0.72, b.r * 1.9, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.shadowBlur = 0;
        // 敌方子弹：小兵简易粉红小弹 / Boss 专属卡通弹（七种造型）/ 导弹 / 分裂母弹
        for (const b of enemyBullets) {
          if (b.kind === "boss") {
            drawBossBullet(b);
          } else if (b.kind === "missile") {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
            ctx.scale((b.r || 7) / 7, (b.r || 7) / 7);
            ctx.fillStyle = "#dfe7f2";
            ctx.shadowColor = "#ff8a3c"; ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, -10); ctx.lineTo(4.6, 2); ctx.lineTo(4.6, 7); ctx.lineTo(-4.6, 7); ctx.lineTo(-4.6, 2);
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ff5470";
            ctx.beginPath(); ctx.arc(0, -4, 2.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ffb340";
            ctx.beginPath(); ctx.moveTo(-3, 7); ctx.lineTo(0, 12 + Math.random() * 4); ctx.lineTo(3, 7); ctx.closePath(); ctx.fill();
            ctx.restore();
          } else if (b.kind === "split") {
            // 分裂母弹：放大版的魔龙火焰弹（造型与它分裂出的子弹一致），外加一圈警示环
            ctx.save();
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2 + Math.sin(performance.now() / 90) * 1.5, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,138,60,.55)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
            drawBossBullet(b);
          } else {
            // 小兵子弹：故意做得朴素——小小粉红圆弹 + 一点高光，和 Boss 专属弹一眼区分
            ctx.fillStyle = "#ff7d92";
            ctx.shadowColor = "#ff5470"; ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r - 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(255,255,255,.75)";
            ctx.beginPath();
            ctx.arc(b.x - (b.r - 1) * 0.32, b.y - (b.r - 1) * 0.32, (b.r - 1) * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.shadowBlur = 0;
        // 玩家
        if (player.alive && state !== STATE.OVER) {
          const blink = player.invuln > 0 && Math.floor(performance.now() / 110) % 2 === 0;
          drawShip(player.x, player.y, player.tilt, blink);
          // 限时增强中：金色光环 + 剩余时间弧
          if (boostT > 0) {
            ctx.save();
            ctx.translate(player.x, player.y);
            const rr = 30 * evoDef().scale + 8 + Math.sin(performance.now() / 150) * 2;
            ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,233,60,.35)"; ctx.lineWidth = 5; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, rr, -Math.PI / 2, -Math.PI / 2 + (boostT / BOOST_DURATION) * Math.PI * 2);
            ctx.strokeStyle = "#ffe93c"; ctx.lineWidth = 3; ctx.stroke();
            ctx.restore();
          }
        }
        // 粒子
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        // 漂浮字
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        for (const f of floaters) {
          ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
          ctx.fillStyle = f.color;
          ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        // 闪光弹白闪
        if (flash > 0) {
          ctx.fillStyle = "rgba(200,245,255," + (flash * 0.6) + ")";
          ctx.fillRect(0, 0, W, H);
        }
        // Boss 出场红色警戒边框
        if (warnT > 0) {
          const a = Math.min(0.55, warnT) * (0.55 + 0.45 * Math.sin(performance.now() / 110));
          const wg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
          wg2.addColorStop(0, "rgba(255,40,60,0)");
          wg2.addColorStop(1, "rgba(255,40,60," + Math.max(0, a) + ")");
          ctx.fillStyle = wg2;
          ctx.fillRect(0, 0, W, H);
        }
      }

      /* ---------------- 主循环 ---------------- */
      function loop(ts) {
        const dt = Math.min(0.033, lastTime ? (ts - lastTime) / 1000 : 0.016);
        lastTime = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      /* ---------------- 输入 ---------------- */
      function stagePos(evt) {
        const r = canvas.getBoundingClientRect();
        const t = evt.touches ? evt.touches[0] : evt;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      let dragging = false, dragOffset = { x: 0, y: 0 };
      canvas.addEventListener("pointerdown", e => {
        ac();
        dragging = true;
        const p = stagePos(e);
        dragOffset = { x: player.x - p.x, y: player.y - p.y };
        pointer = { x: p.x + dragOffset.x, y: p.y + dragOffset.y - 46 };
        canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", e => {
        if (!dragging) return;
        const p = stagePos(e);
        pointer = { x: p.x + dragOffset.x, y: p.y + dragOffset.y - 46 };
      });
      const endDrag = () => { dragging = false; };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
        if (k === " " && state === STATE.PLAYING) useBomb();
        if ((k === "p" || k === "escape")) togglePause();
      });
      window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

      /* ---------------- 按钮 ---------------- */
      function startGame() {
        ac();
        el.startScreen.classList.add("hidden");
        el.overScreen.classList.add("hidden");
        el.pauseScreen.classList.add("hidden");
        state = STATE.PLAYING;
        resetGame();
        music.start();
      }
      function togglePause() {
        if (state === STATE.PLAYING) {
          state = STATE.PAUSED;
          el.pauseScreen.classList.remove("hidden");
        } else if (state === STATE.PAUSED) {
          state = STATE.PLAYING;
          el.pauseScreen.classList.add("hidden");
        }
        updateHUD();
      }
      /* ---------------- 机库商店 ---------------- */
      function shipArtSVG(key) {
        const s = SHIPS[key];
        const wMul = key === "swift" ? 0.72 : key === "heavy" ? 1.18 : 1;
        const ring = (key === "wall" || key === "phoenix") ? '<circle cx="30" cy="26" r="24" fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9"/>' : "";
        const cannons = (key === "heavy" || key === "titan") ? '<rect x="7" y="8" width="6" height="17" rx="3" fill="#dfe7f2" stroke="rgba(0,0,0,.3)"/><rect x="47" y="8" width="6" height="17" rx="3" fill="#dfe7f2" stroke="rgba(0,0,0,.3)"/>' : "";
        return '<svg width="60" height="52" viewBox="0 0 60 52" aria-hidden="true">' + ring + cannons
          + '<g transform="translate(30 26) scale(' + wMul + ' 1) translate(-30 -26)">'
          + '<path d="M30 3 L38 20 L50 34 L42 36 L40 46 L20 46 L18 36 L10 34 L22 20 Z" fill="' + s.color + '" stroke="rgba(0,0,0,.35)" stroke-width="1.5" stroke-linejoin="round"/>'
          + '<ellipse cx="30" cy="24" rx="4.5" ry="8" fill="#eaffff" opacity="0.92"/></g>'
          + '<path d="M26 46 L30 52 L34 46 Z" fill="#ffb340"/></svg>';
      }
      function renderShop() {
        if (el.shopCoins) el.shopCoins.textContent = save.coins.toLocaleString("zh-CN");
        el.shopShips.innerHTML = SHIP_KEYS.map(key => {
          const s = SHIPS[key];
          const owned = save.ownedShips.includes(key);
          const selected = save.ship === key;
          let btn;
          if (selected) btn = '<button class="shop-btn current" disabled>✔ 当前战机</button>';
          else if (owned) btn = '<button class="shop-btn pick" data-act="pick" data-key="' + key + '">选择这架出击</button>';
          else if (save.coins >= s.price) btn = '<button class="shop-btn buy" data-act="buy-ship" data-key="' + key + '">🪙 ' + s.price + ' · 购买解锁</button>';
          else btn = '<button class="shop-btn buy" disabled>🪙 ' + s.price + ' · 金币不足</button>';
          return '<div class="shop-card' + (owned ? " owned" : "") + (selected ? " selected" : "") + '">'
            + '<div class="ship-art">' + shipArtSVG(key) + '</div>'
            + '<div class="card-name" style="color:' + s.color + '">' + s.name
            + (selected ? '<span class="tag">使用中</span>' : owned ? '<span class="tag" style="background:#4be38a">已解锁</span>' : "") + '</div>'
            + '<div class="card-desc">' + s.desc + '</div>'
            + '<div class="card-price' + (s.price === 0 ? " free" : "") + '">' + (s.price === 0 ? "免费 · 默认战机" : "🪙 " + s.price + " 金币") + '</div>'
            + btn + '</div>';
        }).join("");
        el.shopUnlocks.innerHTML = UNLOCK_KEYS.map(key => {
          const u = UNLOCKS[key];
          const owned = !!save.unlocks[key];
          let btn;
          if (owned) btn = '<button class="shop-btn pick" disabled>✔ 已解锁 · 永久生效</button>';
          else if (save.coins >= u.price) btn = '<button class="shop-btn buy" data-act="buy-unlock" data-key="' + key + '">🪙 ' + u.price + ' · 购买解锁</button>';
          else btn = '<button class="shop-btn buy" disabled>🪙 ' + u.price + ' · 金币不足</button>';
          return '<div class="shop-card' + (owned ? " owned" : "") + '">'
            + '<div class="ship-art"><div style="width:46px;height:46px;border-radius:50%;background:' + u.color + ';display:grid;place-items:center;font-size:20px;font-weight:900;color:#221a04;border:2.5px solid rgba(0,0,0,.3)">' + u.icon + '</div></div>'
            + '<div class="card-name" style="color:' + u.color + '">' + u.name + (owned ? '<span class="tag" style="background:#4be38a">已解锁</span>' : "") + '</div>'
            + '<div class="card-desc">' + u.desc + '</div>'
            + '<div class="card-price">🪙 ' + u.price + " 金币</div>"
            + btn + '</div>';
        }).join("");
      }
      function openShop() { ac(); renderShop(); el.shopScreen.classList.remove("hidden"); el.shopScreen.scrollTop = 0; }
      function closeShop() { el.shopScreen.classList.add("hidden"); updateHUD(); }
      el.shopScreen.addEventListener("click", e => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const act = btn.getAttribute("data-act"), key = btn.getAttribute("data-key");
        if (act === "pick" && SHIPS[key] && save.ownedShips.includes(key)) {
          save.ship = key;
          persistSave(); renderShop(); updateHUD();
          toast("已换上 " + SHIPS[key].name);
          sfx.shieldUp();
        } else if (act === "buy-ship" && SHIPS[key] && !save.ownedShips.includes(key)) {
          if (save.coins < SHIPS[key].price) { toast("金币不足，还差 " + (SHIPS[key].price - save.coins) + " 枚"); return; }
          save.coins -= SHIPS[key].price;
          save.ownedShips.push(key);
          save.ship = key; // 买下直接换上
          persistSave(); renderShop(); updateHUD();
          toast("买下并换上 " + SHIPS[key].name + "！");
          sfx.weaponUp(4);
          buzz(30);
        } else if (act === "buy-unlock" && UNLOCKS[key] && !save.unlocks[key]) {
          if (save.coins < UNLOCKS[key].price) { toast("金币不足，还差 " + (UNLOCKS[key].price - save.coins) + " 枚"); return; }
          save.coins -= UNLOCKS[key].price;
          save.unlocks[key] = true;
          persistSave(); renderShop(); updateHUD();
          toast("已解锁「" + UNLOCKS[key].name + "」，永久生效！");
          sfx.weaponUp(4);
          buzz(30);
        }
      });
      document.getElementById("shop-btn").addEventListener("click", openShop);
      document.getElementById("over-shop-btn").addEventListener("click", openShop);
      document.getElementById("shop-close-btn").addEventListener("click", closeShop);

      document.querySelectorAll(".diff-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          difficulty = btn.getAttribute("data-diff") || "normal";
          document.querySelectorAll(".diff-btn").forEach(b => b.classList.toggle("sel", b === btn));
          ac();
          tone(660, 0.08, { type: "triangle", vol: 0.04, slideTo: 990 });
        });
      });
      document.getElementById("start-btn").addEventListener("click", startGame);
      document.getElementById("retry-btn").addEventListener("click", startGame);
      document.getElementById("resume-btn").addEventListener("click", togglePause);
      document.getElementById("pause-btn").addEventListener("click", () => { if (state === STATE.PLAYING || state === STATE.PAUSED) togglePause(); });
      el.bombBtn.addEventListener("click", useBomb);
      el.soundBtn.addEventListener("click", () => {
        muted = !muted;
        el.soundBtn.textContent = muted ? "🔇" : "🔊";
        if (!muted) { ac(); if (state === STATE.PLAYING) music.start(); }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === STATE.PLAYING) togglePause();
      });

      /* ---------------- 启动 ---------------- */
      loadSave();
      renderShop();
      resize();
      initStars();
      player.x = W / 2; player.y = H - 110;
      updateHUD();
      requestAnimationFrame(loop);
      setTimeout(() => { resize(); initStars(); if (state === STATE.MENU) { player.x = W / 2; player.y = H - 110; } }, 120);
    </script>
  </body>
</html>
